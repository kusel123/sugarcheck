/* ---------- 统计 ---------- */
function monthLabel(mKey){
  var y=parseInt(mKey.slice(0,4),10),m=parseInt(mKey.slice(5,7),10);
  return y+' 年 '+m+' 月';
}
function shiftMonth(mKey,n){
  var y=parseInt(mKey.slice(0,4),10),m=parseInt(mKey.slice(5,7),10)-1;
  var d=new Date(y,m+n,1);
  return monthKey(d);
}
function heatmap(mKey){
  var y=parseInt(mKey.slice(0,4),10),m=parseInt(mKey.slice(5,7),10)-1;
  var first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  var off=(first.getDay()+6)%7,total=state.habits.length,T=todayISO(),cells='';
  for(var i=0;i<7;i++)cells+='<div class="hm-wd">'+WEEK_CN[i]+'</div>';
  for(var o=0;o<off;o++)cells+='<div class="hm-c out"></div>';
  for(var d=1;d<=days;d++){
    var k=y+'-'+pad(m+1)+'-'+pad(d);
    if(k>T){cells+='<div class="hm-c future"><span class="hday">'+d+'</span></div>';continue;}
    var n=doneOn(k).filter(function(id){return !!habitById(id);}).length;
    var ratio=total?n/total:0;
    var bg=ratio===0?'#F7EEF3':ratio<.26?'#EFDCE6':ratio<.51?'#E1C6D2':ratio<.76?'#CBA9B8':ratio<1?'#B08699':'#4A3F4B';
    cells+='<div class="hm-c '+(k===T?'is-today':'')+'" style="background:'+bg+'" title="'+k+' · '+n+'/'+total+' 完成">'+
      '<span class="hday" style="color:'+(ratio>=.5?'rgba(255,255,255,.9)':'var(--ink-3)')+'">'+d+'</span></div>';
  }
  return '<div class="hm">'+cells+'</div>'+
    '<div class="hm-legend"><span>少</span><i style="background:#F7EEF3"></i><i style="background:#EFDCE6"></i>'+
    '<i style="background:#E1C6D2"></i><i style="background:#CBA9B8"></i><i style="background:#B08699"></i><span>多</span></div>';
}
function viewStats(){
  var mKey=ui.month||monthKey(new Date());
  var habits=state.habits;
  var rate=monthRate(mKey),totalChecks=monthDoneCount(mKey),elapsed=elapsedDays(mKey);
  var perfectDays=0;
  Object.keys(state.records).forEach(function(k){
    if(k.slice(0,7)===mKey&&habits.length&&state.records[k].filter(id=>!!habitById(id)).length>=habits.length)perfectDays++;
  });
  var T=todayISO(),days=[],counts=[],maxV=Math.max(1,habits.length),i;
  for(i=13;i>=0;i--){var dt=addDays(new Date(),-i);days.push(dt);counts.push(doneOn(isoOf(dt)).filter(id=>!!habitById(id)).length);}
  counts.forEach(function(c){maxV=Math.max(maxV,c);});
  var bars='',labels='';
  for(i=0;i<days.length;i++){
    var h=Math.max(2,Math.round(counts[i]/maxV*100));
    var isT=isoOf(days[i])===T;
    bars+='<div class="b '+(isT?'is-today':'')+(counts[i]?'':' is-empty')+'" title="'+fmtMD(isoOf(days[i]))+' · '+counts[i]+' 次">'+
      '<i style="height:'+h+'%"></i></div>';
    labels+='<span class="'+((i%3===0||isT)?'tick':'')+'">'+((days[i].getMonth()+1))+'/'+days[i].getDate()+'</span>';
  }
  var perHabit=habits.map(function(h){
    var c=countForHabit(h.id,mKey),el=elapsed||1,p=Math.min(1,c/el),st=streakOf(h.id);
    return '<div class="habit-stat" style="--hue:'+h.color+'">'+
      '<span class="hs-ic">'+hicon(h.icon)+'</span>'+
      '<div class="hs-body"><div class="hs-top"><span class="hs-name">'+esc(h.name)+'</span>'+
        '<span class="hs-val">'+c+' 次 · 连续 '+st+' 天</span></div>'+
        '<div class="hs-bar"><i style="width:'+Math.round(p*100)+'%"></i></div></div></div>';
  }).join('')||'<div class="empty">'+ic('star')+'<span>还没有习惯数据。</span></div>';
  var bal=balance();
  var rewardCards=state.rewards.map(function(r){
    var can=bal>=r.cost;
    return '<div class="reward">'+
      '<button class="reward-del" data-act="delReward" data-id="'+esc(r.id)+'" aria-label="删除">'+ic('trash')+'</button>'+
      '<div class="reward-emo">'+(r.emo||'🎁')+'</div>'+
      '<div class="reward-name">'+esc(r.name)+'</div>'+
      '<div class="reward-need">'+r.cost+' 糖分 · '+(can?'现在就能换':'还差 '+(r.cost-bal))+'</div>'+
      '<button class="reward-btn" data-act="redeem" data-id="'+esc(r.id)+'" '+(can?'':'disabled')+'>'+(can?'兑换':'不够')+'</button></div>';
  }).join('');
  var hist=state.redemptions.length?state.redemptions.slice(0,8).map(function(x){
    return '<div class="hist-row"><span class="hn">'+esc(x.name)+'</span><span class="hc">-'+x.cost+'</span><span class="ht">'+fmtTime(x.at)+'</span></div>';
  }).join(''):'<div class="muted" style="padding:6px 0">还没有兑换记录，攒够糖分找小愿兑换～</div>';
  var wkStart=weekStart(new Date()),wkEnd=addDays(wkStart,6),wkKey=isoOf(wkStart);
  var wkNote=(state.reviews&&state.reviews[wkKey])||'';
  var avg=elapsed?Math.round(totalChecks/elapsed*10)/10:0;

  return '<div class="sec-head" style="display:flex;align-items:center;gap:12px;margin:0 0 16px;flex-wrap:wrap">'+
      '<span class="micro" style="margin-left:2px">Review</span>'+
      '<div style="display:flex;align-items:center;gap:4px;margin-left:auto">'+
        '<button class="iconbtn" style="width:32px;height:32px;border-color:var(--line);background:#fff" data-act="monthShift" data-n="-1" aria-label="上个月">'+ic('left')+'</button>'+
        '<b style="font-size:12.5px;font-weight:600;min-width:104px;text-align:center;letter-spacing:-.01em">'+monthLabel(mKey)+'</b>'+
        '<button class="iconbtn" style="width:32px;height:32px;border-color:var(--line);background:#fff" data-act="monthShift" data-n="1" aria-label="下个月">'+ic('right')+'</button>'+
      '</div></div>'+
    '<div class="tiles">'+
      '<div class="tile card"><div class="tile-label"><span class="micro">本月打卡</span>'+ic('check')+'</div>'+
        '<div class="tile-num">'+totalChecks+'<small>次</small></div>'+
        '<div class="tile-sub"><b>平均 '+avg+' 次 / 天</b></div>'+
        '<div class="tile-bar"><i style="width:'+Math.round(rate*100)+'%"></i></div></div>'+
      '<div class="tile card"><div class="tile-label"><span class="micro">完成率</span>'+ic('target')+'</div>'+
        '<div class="tile-num">'+Math.round(rate*100)+'<small>%</small></div>'+
        '<div class="tile-sub">已过 <b>'+elapsed+'</b> 天 · 目标 '+habits.length*elapsed+' 次</div>'+
        '<div class="tile-bar"><i style="width:'+Math.round(rate*100)+'%"></i></div></div>'+
      '<div class="tile card"><div class="tile-label"><span class="micro">全勤日</span>'+ic('flame')+'</div>'+
        '<div class="tile-num">'+perfectDays+'<small>天</small></div>'+
        '<div class="tile-sub">把所有习惯都点亮的日子</div>'+
        '<div class="tile-bar"><i style="width:'+(elapsed?Math.round(perfectDays/elapsed*100):0)+'%"></i></div></div>'+
    '</div>'+
    '<div class="stats-grid">'+
      '<div class="sg-left">'+
        '<section class="card"><div class="card-h"><span class="ch-ic">'+ic('stats')+'</span><span class="card-t">近 14 天打卡量<small>每天完成几个习惯</small></span></div>'+
          '<div class="card-b"><div class="chart14">'+bars+'</div><div class="chart14-x">'+labels+'</div></div></section>'+
        '<section class="card"><div class="card-h"><span class="ch-ic">'+ic('calendar')+'</span><span class="card-t">打卡热力图<small>'+monthLabel(mKey)+'</small></span></div>'+
          '<div class="card-b">'+heatmap(mKey)+'</div></section>'+
        '<section class="card"><div class="card-h"><span class="ch-ic">'+ic('target')+'</span><span class="card-t">每个习惯<small>当月完成率</small></span></div>'+
          '<div class="card-b">'+perHabit+'</div></section>'+
        '<section class="card"><div class="card-h"><span class="ch-ic">'+ic('pencil')+'</span><span class="card-t">本周小结<small>'+fmtMD(wkKey)+' – '+fmtMD(isoOf(wkEnd))+'</small></span></div>'+
                  '<div class="card-b"><textarea class="week-note" id="weekNote" data-key="'+wkKey+'" placeholder="这周什么做得顺、什么卡住了？写三句就好，不用漂亮。">'+esc(wkNote)+'</textarea>'+
          '<span style="font-size:10px;color:var(--ink-3);margin-top:6px;display:block">离开输入框自动保存</span></div></section>'+
      '</div>'+
      '<div class="sg-right">'+
        '<div class="points"><span class="micro">Sugar balance</span><div class="points-num">'+bal+'<small>糖分</small></div>'+
          '<div class="points-sub">累计获得 '+state.points.earned+' · 已兑换 '+state.points.spent+'</div></div>'+
        '<section class="card"><div class="card-h"><span class="ch-ic">'+ic('spark')+'</span><span class="card-t">奖励展板<small>'+state.rewards.length+' 个</small></span>'+
          '<div class="card-act"><button class="link" data-act="addReward">'+ic('plus')+' 上架</button></div></div>'+
          '<div class="card-b"><div class="rewards">'+(rewardCards||'<div class="empty" style="grid-column:1/-1">'+ic('spark')+'<span>还没有奖励。给自己定一个真正想要的吧。</span><button class="btn sm primary" data-act="addReward">'+ic('plus')+' 添加奖励</button></div>')+'</div></div></section>'+
        '<section class="card"><div class="card-h"><span class="ch-ic">'+ic('clock')+'</span><span class="card-t">兑换记录<small>'+state.redemptions.length+' 次</small></span></div>'+
          '<div class="card-b" style="padding-top:6px"><div class="hist">'+hist+'</div></div></section>'+
      '</div>'+
    '</div>';
}

/* ---------- 弹层 ---------- */
function openModal(html){
  document.getElementById('modalBox').innerHTML=html;
  document.getElementById('modal').classList.add('is-open');
  document.getElementById('modalBox').scrollTop=0;
}
function closeModal(){document.getElementById('modal').classList.remove('is-open');}
function modalHead(title,sub){
  return '<div class="modal-h"><div><h3>'+esc(title)+'</h3>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>'+
    '<button class="modal-x" data-act="closeModal" aria-label="关闭">'+ic('close')+'</button></div>';
}
function pickerHTML(pick,colors){
  return '<div class="field"><span>图标</span><div class="icon-pick" id="mIcons">'+
    ICON_NAMES.map(function(n){return '<button type="button" data-icon="'+n+'" class="'+(n===pick.icon?'is-on':'')+'">'+hicon(n)+'</button>';}).join('')+
    '</div></div>'+
    '<div class="field"><span>颜色</span><div class="color-pick" id="mColors">'+
    (colors||COLOR_SET).map(function(c){return '<button type="button" data-color="'+c+'" class="'+(c===pick.color?'is-on':'')+'" style="background:'+c+'"></button>';}).join('')+
    '</div></div>';
}
function bindPickers(){
  var ib=document.getElementById('mIcons'),cb=document.getElementById('mColors');
  if(ib)ib.onclick=function(e){
    var b=e.target.closest('button[data-icon]');if(!b)return;
    window._pick.icon=b.getAttribute('data-icon');
    ib.querySelectorAll('button').forEach(function(x){x.classList.toggle('is-on',x===b);});
  };
  if(cb)cb.onclick=function(e){
    var b=e.target.closest('button[data-color]');if(!b)return;
    window._pick.color=b.getAttribute('data-color');
    cb.querySelectorAll('button').forEach(function(x){x.classList.toggle('is-on',x===b);});
  };
}

function searchResults(q){
  q=(q||'').trim().toLowerCase();
  var out=[];
  function hit(s){return String(s||'').toLowerCase().indexOf(q)>-1;}
  if(!q){
    out.push({group:'快捷'});
    if(state.projects.length)out.push({t:'新建任务',m:'写一件有截止日的事',ic:'plus',act:'addTask'});
    out.push({t:'新建习惯',m:'每天一点点',ic:'star',act:'addHabit'});
    out.push({t:'新建项目',m:'像「画画」「英语」这样的大类',ic:'folder',act:'addProject'});
    out.push({t:'打开收集箱',m:'先收集，再决定',ic:'inbox',act:'go',r:'inbox'});
    return out;
  }
  var tasks=allTasks().filter(function(t){
    var p=taskProject(t);
    return hit(t.name)||(t.tags||[]).some(hit)||hit(t.note)||(p&&hit(p.name));
  }).slice(0,6);
  if(tasks.length){out.push({group:'任务'});tasks.forEach(function(t){
    var p=taskProject(t);
    out.push({t:t.name,m:(p?p.name:'未归类')+' · '+(t.due?fmtDue(t.due):'未排期')+(t.status==='done'?' · 已完成':''),ic:'check',act:'editTask',id:t.id,pid:t.projectId});
  });}
  var projects=state.projects.filter(function(p){return hit(p.name)||hit(p.note);}).slice(0,4);
  if(projects.length){out.push({group:'项目'});projects.forEach(function(p){
    out.push({t:p.name,m:p.tasks.length+' 个任务 · '+projStats(p).pct+'% 完成',ic:'folder',act:'openProject',id:p.id});
  });}
  var habits=state.habits.filter(h=>hit(h.name)).slice(0,4);
  if(habits.length){out.push({group:'习惯'});habits.forEach(function(h){
    out.push({t:h.name,m:'连续 '+streakOf(h.id)+' 天 · 本月 '+countForHabit(h.id,monthKey(new Date()))+' 次',ic:'star',act:'go',r:'today'});
  });}
  var ideas=state.ideas.filter(i=>hit(i.text)).slice(0,4);
  if(ideas.length){out.push({group:'灵感'});ideas.forEach(function(i){
    out.push({t:i.text,m:(i.status==='doing'?'推进中':i.status==='done'?'已完成':'想法'),ic:'bulb',act:'go',r:'inbox'});
  });}
  return out;
}

function isCloudConfigured(){

}
function syncKeySig(){
  if(!isCloudConfigured())return '';

}
function readSyncBase(){

}
function writeSyncBase(){
  if(!isCloudConfigured())return;
  try{
    localStorage.setItem(LS_SYNC_BASE,JSON.stringify({
      sig:syncKeySig(),
      earned:state.points.earned,
      spent:state.points.spent
    }));
  }catch(e){}
}
function setSync(mode,text){
  syncInfo.mode=mode;syncInfo.text=text;

}
function refreshSyncBadge(){
  if(!isCloudConfigured()){setSync('local','本地');return;}
  if(isSyncing){setSync('busy','同步中…');return;}
  if(syncDirty){setSync('dirty',navigator.onLine?'待上传':'离线待传');return;}
  setSync('ok',state.lastSyncAt?('已同步 '+fmtClock(state.lastSyncAt)):'云端就绪');
}
function readCloudFormIfVisible(){

    if(aa)state.cloud.auto=!!aa.checked;
    save(false);
  }
}
function schedulePush(){
  if(!isCloudConfigured()||state.cloud.auto===false)return;
  syncDirty=true;
  refreshSyncBadge();
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    runCloudSync({forcePush:true,silent:true});
  },1500);
}
function cloudHeaders(extra){
  return Object.assign({
    'apikey':state.cloud.key,
    'Authorization':'Bearer '+state.cloud.key,
    'Content-Type':'application/json'
  },extra||{});
}
async function pullCloud(){
  var base=state.cloud.url.replace(/\/+$/,''),tbl=encodeURIComponent(state.cloud.table||'habit_snapshots'),sid=encodeURIComponent(state.cloud.syncId);
  var res=await fetch(base+'/rest/v1/'+tbl+'?id=eq.'+sid+'&select=payload',{headers:cloudHeaders(),cache:'no-store'});
  if(!res.ok)throw new Error('拉取失败 ('+res.status+')');
  var rows=await res.json();
  if(!Array.isArray(rows)||!rows.length)return null;
  var pl=rows[0].payload;
  return typeof pl==='string'?JSON.parse(pl):pl;
}
function buildCloudPayload(){
  var copy=JSON.parse(JSON.stringify(state));
  if(copy.cloud)copy.cloud={url:'',key:'',table:copy.cloud.table||'habit_snapshots',syncId:'',auto:copy.cloud.auto!==false};
  copy.demo=false;
  return copy;
}
async function pushCloud(payloadObj){
  var base=state.cloud.url.replace(/\/+$/,''),tbl=encodeURIComponent(state.cloud.table||'habit_snapshots');
  var body=[{id:state.cloud.syncId,payload:payloadObj,updated_at:new Date().toISOString()}];
  var res=await fetch(base+'/rest/v1/'+tbl+'?on_conflict=id',{
    method:'POST',
    headers:cloudHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify(body)
  });
  if(!res.ok){
    delete body[0].updated_at;
    var retry=await fetch(base+'/rest/v1/'+tbl+'?on_conflict=id',{
      method:'POST',
      headers:cloudHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify(body)
    });
    if(!retry.ok)throw new Error('上传失败 ('+retry.status+')');
  }
}
function mergeById(lArr,rArr,normFn,tombs){
  var map=new Map(),order=[];
  (rArr||[]).forEach(function(raw){
    if(!raw||!raw.id)return;
    var it=normFn(raw);map.set(it.id,it);order.push(it.id);
  });
  (lArr||[]).forEach(function(raw){
    if(!raw||!raw.id)return;
    var it=normFn(raw),prev=map.get(it.id);
    if(!prev){map.set(it.id,it);order.push(it.id);}
    else if((it.updatedAt||0)>=(prev.updatedAt||0)){map.set(it.id,it);}
  });
  var seen={};
  return order.filter(function(id){if(seen[id])return false;seen[id]=1;return true;}).map(function(id){return map.get(id);}).filter(function(it){
    var delAt=tombs[it.id]||0;
    return !(delAt>0&&delAt>=(it.updatedAt||0));
  });
}
function mergeCloud(pl){
  if(!pl||typeof pl!=='object')return false;
  var keepCloud=Object.assign({},state.cloud);

  /* 新设备首次连接：本地还是未改动的演示数据时，直接采用云端真实数据，绝不把演示数据混进云端 */
  if(state.demo){
    state=normalizeState(pl);
    state.cloud=keepCloud;
    state.demo=false;
    writeSyncBase();
    return true;
  }

  var rNorm=normalizeState(pl);

  /* 1. 合并 60 天内的删除墓碑 */
  var cutoff=Date.now()-60*86400000;
  var tombs={};
  Object.keys(rNorm._tombstones||{}).forEach(function(k){if(rNorm._tombstones[k]>cutoff)tombs[k]=rNorm._tombstones[k];});
  Object.keys(state._tombstones||{}).forEach(function(k){
    var v=Math.max(tombs[k]||0,state._tombstones[k]||0);
    if(v>cutoff)tombs[k]=v;
  });
  state._tombstones=tombs;

  /* 2. 合并习惯、奖励、收集箱灵感 */
  state.habits=mergeById(state.habits,rNorm.habits,normHabit,tombs);
  state.rewards=mergeById(state.rewards,rNorm.rewards,normReward,tombs);
  state.ideas=mergeById(state.ideas,rNorm.ideas,normIdea,tombs);

  /* 3. 合并项目、里程碑与跨项目任务 */
  var lTaskMap=new Map(),rTaskMap=new Map(),taskOrder=[];
  state.projects.forEach(function(p){(p.tasks||[]).forEach(function(t){t.projectId=p.id;lTaskMap.set(t.id,t);taskOrder.push(t.id);});});
  rNorm.projects.forEach(function(p){(p.tasks||[]).forEach(function(t){t.projectId=p.id;rTaskMap.set(t.id,t);if(taskOrder.indexOf(t.id)<0)taskOrder.push(t.id);});});

  var mergedProjs=mergeById(state.projects,rNorm.projects,function(p){
    var np=normProject(p);np.tasks=[];return np;
  },tombs);
  var lProjById={},rProjById={},mProjById={};
  state.projects.forEach(function(p){lProjById[p.id]=p;});
  rNorm.projects.forEach(function(p){rProjById[p.id]=p;});
  mergedProjs.forEach(function(p){
    var lp=lProjById[p.id],rp=rProjById[p.id];
    p.milestones=mergeById(lp?lp.milestones:[],rp?rp.milestones:[],normMilestone,tombs);
    mProjById[p.id]=p;
  });
  state.projects=mergedProjs;

  taskOrder.forEach(function(tid){
    var lt=lTaskMap.get(tid),rt=rTaskMap.get(tid);
    var win=(lt&&rt)?((lt.updatedAt||0)>=(rt.updatedAt||0)?lt:rt):(lt||rt);
    if(!win)return;
    var delAt=tombs[win.id]||0;
    if(delAt>0&&delAt>=(win.updatedAt||0))return;
    var targetP=mProjById[win.projectId];
    if(!targetP){
      var delProjAt=tombs[win.projectId]||0;
      if(delProjAt>0&&delProjAt>=(win.updatedAt||0))return;
      targetP=ensureProject();
      mProjById[targetP.id]=targetP;
    }
    var cleanT=normTask(win,targetP.id);
    targetP.tasks.push(cleanT);
  });

  /* 4. 合并每日习惯打卡记录（精确到单日单习惯点击时间，支持取消打卡同步） */
  var lMeta=state._recMeta||{},rMeta=rNorm._recMeta||{},mMeta={};
  Object.keys(rMeta).forEach(function(k){mMeta[k]=rMeta[k];});
  Object.keys(lMeta).forEach(function(k){mMeta[k]=Math.max(lMeta[k]||0,rMeta[k]||0);});
  state._recMeta=mMeta;

  var dateSet={};
  Object.keys(state.records||{}).forEach(function(d){dateSet[d]=1;});
  Object.keys(rNorm.records||{}).forEach(function(d){dateSet[d]=1;});
  var mergedRec={};
  Object.keys(dateSet).forEach(function(d){
    var la=state.records[d]||[],ra=rNorm.records[d]||[];
    var idSet={};
    la.forEach(function(id){idSet[id]=1;});
    ra.forEach(function(id){idSet[id]=1;});
    var finalIds=[];
    Object.keys(idSet).forEach(function(hid){
      var mk=d+'|'+hid,lt=lMeta[mk]||0,rt=rMeta[mk]||0;
      var lHas=la.indexOf(hid)>-1,rHas=ra.indexOf(hid)>-1;
      var keep=(lt===0&&rt===0)?(lHas||rHas):(lt>=rt?lHas:rHas);
      if(keep)finalIds.push(hid);
    });
    if(finalIds.length)mergedRec[d]=finalIds;
  });
  state.records=mergedRec;

  /* 5. 合并兑换流水、标签池、周复盘小结 */
  var redMap=new Map();
  (rNorm.redemptions||[]).concat(state.redemptions||[]).forEach(function(x){if(x&&x.id)redMap.set(x.id,x);});
  state.redemptions=Array.from(redMap.values()).sort(function(a,b){return (b.at||0)-(a.at||0);}).slice(0,200);

  var pool=[];
  (state.tagPool||[]).concat(rNorm.tagPool||[]).forEach(function(t){
    if(t&&pool.indexOf(t)<0&&!tombs['tag:'+t])pool.push(t);
  });
  state.tagPool=pool.slice(0,40);

  var lRevM=state._revMeta||{},rRevM=rNorm._revMeta||{},mRevM={};
  var revKeys={};
  Object.keys(state.reviews||{}).forEach(function(k){revKeys[k]=1;});
  Object.keys(rNorm.reviews||{}).forEach(function(k){revKeys[k]=1;});
  Object.keys(revKeys).forEach(function(k){
    var lt=lRevM[k]||0,rt=rRevM[k]||0;
    if(rt>lt){state.reviews[k]=rNorm.reviews[k];mRevM[k]=rt;}
    else{if(!(k in state.reviews))state.reviews[k]=rNorm.reviews[k];mRevM[k]=Math.max(lt,rt);}
  });
  state._revMeta=mRevM;

  /* 6. 合并糖分积分（按上次同步基线累加净增减，双端同时打卡不丢分） */
  var base=readSyncBase(),sig=syncKeySig();
  if(base&&base.sig===sig&&typeof base.earned==='number'){
    var dEarn=state.points.earned-base.earned;
    var dSpent=state.points.spent-(base.spent||0);
    state.points.earned=Math.max(0,(rNorm.points.earned||0)+dEarn);
    state.points.spent=Math.max(0,(rNorm.points.spent||0)+dSpent);
  }else{
    state.points.earned=Math.max(state.points.earned||0,rNorm.points.earned||0);
    state.points.spent=Math.max(state.points.spent||0,rNorm.points.spent||0);
  }
  state.cloud=keepCloud;
  return true;
}
async function runCloudSync(opts){
  opts=opts||{};
  if(!isCloudConfigured()){refreshSyncBadge();return false;}
  if(isSyncing)return false;
  if(!navigator.onLine){
    if(opts.forcePush)syncDirty=true;
    refreshSyncBadge();
    if(!opts.silent)toast('当前离线，恢复网络后会自动合并上传');
    return false;
  }
  isSyncing=true;
  setSync('busy','同步中…');
  try{
    var remote=await pullCloud();
    if(remote){
      mergeCloud(remote);
    }
    var outPayload=buildCloudPayload();
    var needPush=opts.forcePush||syncDirty||!remote;
    if(!needPush&&remote){
      needPush=JSON.stringify(outPayload.records)!==JSON.stringify(remote.records)||
        JSON.stringify(outPayload.points)!==JSON.stringify(remote.points)||
        (outPayload.habits||[]).length!==(remote.habits||[]).length||
        (outPayload.projects||[]).length!==(remote.projects||[]).length;
    }
    if(needPush){
      await pushCloud(outPayload);
    }
    syncDirty=false;
    lastPullCheck=Date.now();
    state.lastSyncAt=lastPullCheck;
    writeSyncBase();
    save(false);
    setSync('ok','已同步 '+fmtClock(state.lastSyncAt));
    render();
    if(!opts.silent)toast('手机与电脑数据已完成合并！( ᐢ ᵕ ᐢ )♡','已同步');
    return true;
  }catch(err){
    setSync('err',err.message||'同步异常');
    if(!opts.silent)toast(err.message||'云同步失败');
    return false;
  }finally{
    isSyncing=false;
    if(syncInfo.mode==='busy')refreshSyncBadge();
  }
}
function buildPairLink(){
  readCloudFormIfVisible();
  if(!isCloudConfigured())return '';
  var raw=JSON.stringify({
    u:state.cloud.url.replace(/\/+$/,''),
    k:state.cloud.key,
    t:state.cloud.table||'habit_snapshots',
    s:state.cloud.syncId,
    a:state.cloud.auto!==false
  });
  var b64=btoa(unescape(encodeURIComponent(raw)));
  return location.origin+location.pathname+'#pair='+b64;
}
function checkPairHash(){
  var h=location.hash||'';
  if(h.indexOf('#pair=')!==0)return false;
  try{
    var raw=decodeURIComponent(escape(atob(h.slice(6))));
    var d=JSON.parse(raw);
    if(d&&d.u&&d.k&&d.s){
      state.cloud={
        url:String(d.u).trim().replace(/\/+$/,''),
        key:String(d.k).trim(),
        table:String(d.t||'habit_snapshots').trim(),
        syncId:String(d.s).trim(),
        auto:d.a!==false
      };
      save(false);
      history.replaceState(null,'',location.pathname+location.search+'#today');
      setTimeout(function(){
        toast('配对成功，正在从云端同步数据…','SUPABASE');
        runCloudSync({forcePush:false,silent:false});
      },120);
      return true;
    }
  }catch(e){}
  return false;
}
function copyTextSafe(str){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(str);
  }
  return new Promise(function(resolve,reject){
    try{
      var ta=document.createElement('textarea');
      ta.value=str;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);resolve();
    }catch(e){reject(e);}
  });
}

function applyHabit(id,day){
  if(!state.records[day])state.records[day]=[];
  if(!state._recMeta)state._recMeta={};
  state._recMeta[day+'|'+id]=Date.now();
  var idx=state.records[day].indexOf(id);
  if(idx>-1){state.records[day].splice(idx,1);if(!state.records[day].length)delete state.records[day];addPoints(-1);}
  else{state.records[day].push(id);addPoints(1);}
  save();
}
function applyTaskDone(t,done){
  var wasDone=t.status==='done'||t.done;
  if(done){
    if(t.status!=='done')t.prevStatus=t.status;
    t.done=true;t.status='done';t.doneAt=todayISO();addPoints(2);
  }else{
    t.done=false;
    t.status=(t.prevStatus&&t.prevStatus!=='done')?t.prevStatus:'todo';
    t.doneAt=null;addPoints(-2);
  }
  t.updatedAt=Date.now();
  save();
  return wasDone;
}

  if(act==='fIdea'){ui.ideaFilter=el.getAttribute('data-f');render();return;}
  if(act==='manageTags'){openTagManager();return;}
  if(act==='newTag'){openTagModal('new',null,null,el.getAttribute('data-man')==='1');return;}
  if(act==='tagEdit'){e.stopPropagation();openTagModal('rename',null,el.getAttribute('data-tag'),el.getAttribute('data-man')==='1');return;}
  if(act==='tagAdd'){e.stopPropagation();openTagModal('add',id);return;}
  if(act==='tagDelete'){
    var dt=el.getAttribute('data-tag');
    if(dt&&confirm('删除标签「#'+dt+'」？任务会保留，只去掉这个标签。')){
      removeTag(dt);openTagManager();toast('标签已删除');
    }
    return;
  }
  if(act==='saveTag'){
    var tgName=(document.getElementById('tagName').value||'').replace(/^#/,'').trim().slice(0,10);
    if(!tgName){toast('先写个标签名');return;}
    var ctx=window._tagCtx||{mode:'new',id:'',old:''},nowTag=Date.now();
    unmarkTomb('tag:'+tgName);
    if(ctx.mode==='add'){
      var tk2=taskById(ctx.id);
      if(tk2){
        if(tk2.tags.length>=4&&tk2.tags.indexOf(tgName)<0){toast('一个任务最多 4 个标签');return;}
        if(tk2.tags.indexOf(tgName)<0){tk2.tags.push(tgName);tk2.updatedAt=nowTag;}
      }
      if(state.tagPool.indexOf(tgName)<0)state.tagPool.push(tgName);
      toast('标签加好了');
    }else{
      var oldT=ctx.old;
      if(oldT&&oldT!==tgName){
        allTasks().forEach(function(t){var ix=t.tags.indexOf(oldT);if(ix>-1){t.tags[ix]=tgName;t.updatedAt=nowTag;}});
        var pix=state.tagPool.indexOf(oldT);if(pix>-1)state.tagPool[pix]=tgName;
        markTomb('tag:'+oldT);
        if(ui.bf.tag===oldT)ui.bf.tag=tgName;
      }
      if(state.tagPool.indexOf(tgName)<0)state.tagPool.push(tgName);
      toast('标签已更新');
    }
    var backToTags=!!ctx.fromManager;
    save();closeModal();render();
    if(backToTags)openTagManager();
    return;
  }
  if(act==='delTagGlobal'){
    var ctx2=window._tagCtx||{old:''};
    if(!ctx2.old)return;
    if(confirm('删除标签「#'+ctx2.old+'」？用到它的任务会保留，只去掉这个标签。')){
      removeTag(ctx2.old);closeModal();
      if(ctx2.fromManager)openTagManager();
      toast('标签已删除');
    }
    return;
  }

  /* 奖励 */
  if(act==='addReward'){openRewardModal();return;}
  if(act==='saveReward'){
    var rName=(document.getElementById('rName').value||'').trim();
    if(!rName){toast('先给奖励取个名字嘛');return;}
    var cost=Math.max(1,parseInt(document.getElementById('rCost').value,10)||10);
    var emo=(window._emo&&window._emo.emo)||'🎁';
    state.rewards.push({id:uid('r_'),name:rName,cost:cost,emo:emo,created:todayISO(),updatedAt:Date.now()});
    save();closeModal();render();toast('心动奖励已上架～');return;
  }
  if(act==='delReward'){
    if(confirm('移除此奖励？')){markTomb(id);state.rewards=state.rewards.filter(r=>r.id!==id);save();render();toast('已移除');}
    return;
  }
  if(act==='redeem'){
    var r=rewardById(id);if(!r)return;
    if(balance()<r.cost){toast('糖分还不够呢，小愿陪你再攒攒～( ᐢ ᵕ ᐢ )♡');return;}
    if(!confirm('用 '+r.cost+' 糖分兑换「'+r.name+'」？兑了就必须开开心心去享受哦！'))return;
    state.points.spent+=r.cost;
    state.redemptions.unshift({id:uid('rd_'),name:r.name,cost:r.cost,at:Date.now()});
    save();render();sparkle();toast('兑换成功！记得真的去享受它 ʚ(｡˃ ᵕ ˂ )ɞ');return;
  }

  /* 收集箱 */
  if(act==='addIdea'){
    var inp=document.getElementById('ideaInput');
    var txt=(inp&&inp.value||'').trim();
    if(!txt){toast('先写点想法嘛～');return;}
    state.ideas.unshift({id:uid('i_'),text:txt,status:'idea',created:todayISO(),updatedAt:Date.now()});
    save();render();toast('已稳稳收进收集箱！(๑˃ᴗ˂)ﻭ');return;
  }
  if(act==='cycleIdea'){
    var it=ideaById(id);
    if(it){it.status=it.status==='idea'?'doing':it.status==='doing'?'done':'idea';it.updatedAt=Date.now();save();render();}
    return;
  }
  if(act==='ideaToProj'){
    var it2=ideaById(id);
    if(it2&&confirm('把灵感「'+it2.text.slice(0,30)+'」变成大类项目？')){
      var now2=Date.now();
      state.projects.push({id:uid('p_'),name:it2.text.slice(0,18),icon:'brush',color:COLOR_SET[state.projects.length%COLOR_SET.length],
        note:'',created:todayISO(),updatedAt:now2,milestones:[],tasks:[]});
      it2.status='doing';it2.updatedAt=now2;save();render();toast('已变成项目，去「项目」加任务吧！');
    }
    return;
  }
  if(act==='ideaToTask'){openIdeaToTaskModal(id);return;}
  if(act==='saveIdeaToTask'){
    var it3=ideaById(id);if(!it3)return;
    var ipid=window._ipid&&window._ipid();
    var due=isoDate(document.getElementById('iDue').value||null),now3=Date.now();
    if(!projectById(ipid)){ipid=ensureProject().id;}
    var tg=projectById(ipid);
    tg.tasks.unshift({id:uid('t_'),name:it3.text.slice(0,60),done:false,status:'todo',due:due,priority:'mid',
      tags:[],estimate:30,projectId:tg.id,note:'',start:'',created:todayISO(),doneAt:null,updatedAt:now3});
    it3.status='doing';it3.updatedAt=now3;
    save();closeModal();render();toast('灵感已变成任务');
    return;
  }
  if(act==='ideaToHabit'){
    var it4=ideaById(id);if(!it4)return;
    var now4=Date.now();
    state.habits.push({id:uid('h_'),name:it4.text.slice(0,24),icon:'star',color:COLOR_SET[state.habits.length%COLOR_SET.length],created:todayISO(),updatedAt:now4});
    it4.status='done';it4.updatedAt=now4;
    save();render();toast('灵感已变成习惯，明天开始打卡吧');
    return;
  }
  if(act==='delIdea'){
    if(confirm('删除此灵感？')){markTomb(id);state.ideas=state.ideas.filter(x=>x.id!==id);save();render();}
    return;
  }

  /* 数据 */
  if(act==='exportJson'){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='sugarcheck-backup-'+todayISO()+'.json';a.click();
    toast('已下载完整数据备份！( ᐢ ᵕ ᐢ )♡');return;
  }
  if(act==='importFile'){var fi=document.getElementById('fileInput');if(fi)fi.click();return;}
  if(act==='clearRecords'){
    if(confirm('清空全部打卡记录？习惯保留。')){
      var clearTs=Date.now();
      Object.keys(state.records||{}).forEach(function(d){
        (state.records[d]||[]).forEach(function(hid){state._recMeta[d+'|'+hid]=clearTs;});
      });
      state.records={};save();render();toast('打卡记录已清空');
    }
    return;
  }
  if(act==='resetAll'){
    if(confirm('彻底重置全部数据？不可恢复！')){
      localStorage.removeItem(LS_SYNC_BASE);
      state=blankState();save(false);refreshSyncBadge();render();toast('已彻底重置');
    }
    return;
  }
  if(act==='scanA'){
    var box=document.getElementById('scanResult');
    var found=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k!==LS_KEY&&k!==LS_SYNC_BASE&&localStorage.getItem(k).length>20){
        try{var p=JSON.parse(localStorage.getItem(k));if(p&&(p.habits||p.records||p.projects))found.push({k:k,p:p});}catch(err){}
      }
    }
    if(!found.length){box.innerHTML='<p class="muted" style="margin-top:8px;font-size:11px">没有在本机找到旧版数据。</p>';return;}
    box.innerHTML=found.map(function(f,idx){
      return '<div class="scan"><span class="sk"><b>'+esc(f.k)+'</b><small>'+(f.p.habits?f.p.habits.length:0)+' 个习惯 · '+(f.p.records?Object.keys(f.p.records).length:0)+' 天记录</small></span>'+
        '<button class="btn sm" data-act="applyScan" data-scan="'+idx+'">恢复</button></div>';
    }).join('');
    box._found=found;return;
  }
  if(act==='applyScan'){
    var res=document.getElementById('scanResult');
    var item=res&&res._found&&res._found[parseInt(el.getAttribute('data-scan'),10)];
    if(item){
      var keepC=Object.assign({},state.cloud);
      state=normalizeState(item.p);state.cloud=keepC;state.demo=false;
      save();render();toast('旧版数据已恢复！');
    }
    return;
  }

  /* 云同步操作 */
  if(act==='copyPairUrl'){
    if(location.protocol==='file:'){
      toast('请先上传到 GitHub Pages 打开在线网址，再复制手机配对链接哦');return;
    }
    var pairUrl=buildPairLink();
    if(!pairUrl){toast('先填好 URL、key 和同步密钥再生成链接');return;}
    copyTextSafe(pairUrl).then(function(){
      toast('配对链接已复制！用手机 Safari / Chrome 打开即可自动连接','已复制');
    }).catch(function(){
      prompt('复制下方链接到手机浏览器打开：',pairUrl);
    });
    return;
  }
  if(act==='syncNow'||act==='testConn'){
    readCloudFormIfVisible();
    if(!isCloudConfigured()){toast('先填完 URL、key 和同步密钥');refreshSyncBadge();return;}
    if(act==='testConn'){
      var base=state.cloud.url.replace(/\/+$/,''),tbl=encodeURIComponent(state.cloud.table||'habit_snapshots');
      setSync('busy','连接中…');
      try{
        var r0=await fetch(base+'/rest/v1/'+tbl+'?select=id&limit=1',{headers:cloudHeaders(),cache:'no-store'});
        if(!r0.ok)throw new Error('连接失败 ('+r0.status+')');
        setSync('ok','连接正常');render();toast('连接成功，数据表可用！');
      }catch(err){setSync('err',err.message||'连接失败');render();toast(err.message||'连接失败');}
      return;
    }
    await runCloudSync({forcePush:true,silent:false});
    return;
  }
});

/* 快速记录保存 */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act="saveQuick"]');
  if(!el)return;
  var nameEl=document.getElementById('qName');
  var name=(nameEl&&nameEl.value||'').trim();
  if(!name){toast('先写一句话嘛');if(nameEl)nameEl.focus();return;}
  var q=ui.quick,nowQ=Date.now();
  if(q.type==='task'){
    var p=projectById(q.proj)||ensureProject();
    var due=q.due==='today'?todayISO():q.due==='tomorrow'?isoOf(addDays(new Date(),1)):null;
    p.tasks.unshift({id:uid('t_'),name:name,done:false,status:'todo',due:due,priority:'mid',tags:[],
      estimate:30,projectId:p.id,note:'',start:'',created:todayISO(),doneAt:null,updatedAt:nowQ});
    toast('已加入「'+p.name+'」','记好了');
  }else if(q.type==='habit'){
    state.habits.push({id:uid('h_'),name:name.slice(0,24),icon:'star',
      color:COLOR_SET[state.habits.length%COLOR_SET.length],created:todayISO(),updatedAt:nowQ});
    toast('新习惯已加入，明天开始打卡','记好了');
  }else{
    state.ideas.unshift({id:uid('i_'),text:name,status:'idea',created:todayISO(),updatedAt:nowQ});
    toast('已收进收集箱','记好了');
  }
  save();closeModal();render();
});

/* 失焦保存 */
document.addEventListener('focusout',function(e){
  var t=e.target;
  if(!t||!t.id)return;
  if(t.id==='pNote'){
    var p=projectById(t.getAttribute('data-pid'));
    if(p){p.note=t.value.slice(0,600);p.updatedAt=Date.now();save();toast('笔记已保存');}
  }
  if(t.id==='weekNote'){
    var k=t.getAttribute('data-key');if(!k)return;
    if(!state.reviews)state.reviews={};
    if(!state._revMeta)state._revMeta={};
    state.reviews[k]=t.value.slice(0,600);
    state._revMeta[k]=Date.now();
    save();toast('本周小结已保存');
  }
});

/* 键盘 */
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  var typing=tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Enter'&&document.getElementById('modal').classList.contains('is-open')&&tag==='input'&&e.target.id!=='tTagNew'){
    var saveBtn=document.querySelector('#modalBox .modal-actions .btn.primary');
    if(saveBtn){e.preventDefault();saveBtn.click();return;}
  }
  if(e.key==='Enter'&&document.getElementById('modal').classList.contains('is-open')&&!typing){
    var btn=document.querySelector('#modalBox .modal-actions .btn.primary');
    if(btn){e.preventDefault();btn.click();return;}
  }
  if(e.key==='Enter'&&document.getElementById('palette').classList.contains('is-open')){
    var cur=document.querySelector('#palList .pal-item.is-cur')||document.querySelector('#palList .pal-item');
    if(cur){e.preventDefault();cur.click();}
    return;
  }
  if(e.key==='ArrowDown'&&document.getElementById('palette').classList.contains('is-open')){e.preventDefault();palMove(1);return;}
  if(e.key==='ArrowUp'&&document.getElementById('palette').classList.contains('is-open')){e.preventDefault();palMove(-1);return;}
  if(e.key==='Escape'){
    if(document.getElementById('palette').classList.contains('is-open')){closeSearch();return;}
    if(document.getElementById('modal').classList.contains('is-open')){closeModal();return;}
    if(document.getElementById('sheet').classList.contains('is-open')){closeSheet();return;}
    return;
  }
  if(typing)return;
  if((e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))){
    e.preventDefault();openSearch();return;
  }
  if(e.key.toLowerCase()==='n'){e.preventDefault();openQuick('task');return;}
  if(e.key==='Enter'){
    var focused=document.activeElement;
    if(focused&&(focused.getAttribute('role')==='button')){focused.click();}
  }
});

/* 拖拽 */
var dragId=null;
document.addEventListener('dragstart',function(e){
  var card=e.target.closest('.tcard');
  if(!card)return;
  dragId=card.getAttribute('data-id');
  card.classList.add('dragging');
  try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(err){}
});
document.addEventListener('dragend',function(){
  dragId=null;
  document.querySelectorAll('.tcard.dragging').forEach(function(c){c.classList.remove('dragging');});
  document.querySelectorAll('.bcol.drop').forEach(function(c){c.classList.remove('drop');});
});
document.addEventListener('dragover',function(e){
  var col=e.target.closest('.bcol');
  if(!col)return;
  e.preventDefault();
  document.querySelectorAll('.bcol.drop').forEach(function(c){if(c!==col)c.classList.remove('drop');});
  col.classList.add('drop');
  try{e.dataTransfer.dropEffect='move';}catch(err){}
});
document.addEventListener('dragleave',function(e){
  var col=e.target.closest('.bcol');
  if(col&&!col.contains(e.relatedTarget))col.classList.remove('drop');
});
document.addEventListener('drop',function(e){
  var col=e.target.closest('.bcol');
  if(!col)return;
  e.preventDefault();
  var id=dragId||e.dataTransfer.getData('text/plain');
  var st=col.getAttribute('data-drop'),t=id?taskById(id):null;
  col.classList.remove('drop');
  if(!t||!st||t.status===st)return;
  var wasDone=t.status==='done';
  t.status=st;t.done=st==='done';t.updatedAt=Date.now();
  if(t.done&&!wasDone){t.doneAt=todayISO();addPoints(2);sparkle();toast('+2 糖分 · '+praise());}
  if(!t.done&&wasDone){t.doneAt=null;addPoints(-2);}
  save();render();
});

/* 文件导入 */
document.addEventListener('change',function(e){
  var t=e.target;if(!t||t.id!=='fileInput')return;
  var f=t.files&&t.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var raw=JSON.parse(String(r.result));
      if(!confirm('导入会覆盖当前这台设备的数据，继续吗？'))return;
      var keepCloud=Object.assign({},state.cloud);
      state=normalizeState(raw);
      if(keepCloud.url&&!state.cloud.url)state.cloud=keepCloud;
      state.demo=false;
      save();render();toast('备份导入成功！( ᐢ ᵕ ᐢ )♡');
    }catch(err){toast('备份文件格式不对哦');}
  };
  r.readAsText(f,'utf-8');t.value='';
});

/* 路由与云同步生命周期 */
function routeFromHash(){
  var h=(location.hash||'').slice(1);
  if(h.indexOf('pair=')===0)return false;
  if(h.indexOf('project/')===0&&projectById(h.slice(8))){ui.projectId=h.slice(8);ui.route='project';return true;}
  if(['today','board','inbox','projects','stats','data'].indexOf(h)>-1){ui.route=h;return true;}
  return false;
}
window.addEventListener('hashchange',function(){
  if(checkPairHash()){render();return;}
  if(routeFromHash()){render();window.scrollTo(0,0);}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&isCloudConfigured()&&state.cloud.auto!==false&&Date.now()-lastPullCheck>10000){
    runCloudSync({forcePush:syncDirty,silent:true});
  }
});
window.addEventListener('focus',function(){
  if(isCloudConfigured()&&state.cloud.auto!==false&&Date.now()-lastPullCheck>12000){
    runCloudSync({forcePush:syncDirty,silent:true});
  }
});
window.addEventListener('online',function(){
  refreshSyncBadge();
  if(isCloudConfigured()&&(syncDirty||state.cloud.auto!==false)){
    runCloudSync({forcePush:syncDirty,silent:true});
  }
});
window.addEventListener('offline',function(){refreshSyncBadge();});

/* 启动 */
(function init(){
  loadState();
  var paired=checkPairHash();
  ui.day=todayISO();
  ui.month=monthKey(new Date());
  ui.currentRemind=rnd(REMINDS);
  if(!routeFromHash())ui.route='today';
  refreshSyncBadge();
  window.scrollTo(0,0);
  render();
  if(!paired&&isCloudConfigured()&&state.cloud.auto!==false){
    runCloudSync({forcePush:false,silent:true});
  }
  var pi=document.getElementById('palInput');
  if(pi){
    pi.addEventListener('input',function(){ui.searchQ=pi.value;renderPalette(pi.value);});
    pi.addEventListener('keydown',function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var cur=document.querySelector('#palList .pal-item.is-cur')||document.querySelector('#palList .pal-item');
        if(cur)cur.click();
      }
    });
  }
})();
</script>
