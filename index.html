<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>糖分打卡 · 每日一点点</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='30' fill='%234a3f4b'/%3E%3Ccircle cx='64' cy='64' r='32' fill='%23f0d9e4'/%3E%3Ccircle cx='64' cy='64' r='14' fill='%23c1a0ac'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='30' fill='%234a3f4b'/%3E%3Ccircle cx='64' cy='64' r='32' fill='%23f0d9e4'/%3E%3Ccircle cx='64' cy='64' r='14' fill='%23c1a0ac'/%3E%3C/svg%3E">

<style>
/* =========================================================
   糖分打卡 · v3 纸感极简（Editorial Minimal）
   配色：夜樱吹雪 #f0d9e4 / #c1a0ac / #806c79 / #4a3f4b
   ========================================================= */
:root{
  --paper:#F4E9EE;
  --paper-2:#EDDCE4;
  --card:#FFFFFF;
  --ink:#4A3F4B;
  --ink-2:#806C79;
  --ink-3:#9C8492;
  --ink-4:#C9B7C1;
  --line:rgba(74,63,75,.11);
  --line-2:rgba(74,63,75,.065);
  --rose:#F0D9E4;
  --rose-2:#8F6B7D;
  --sage:#8F6B7D;
  --sand:#D9C0CC;
  --dark:#2E2530;
  --r:24px;
  --sh-1:0 1px 2px rgba(74,63,75,.05);
  --sh-2:0 22px 44px -36px rgba(74,63,75,.55);
  --f-sans:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --f-serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --f-mono:"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-sans);color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(74,63,75,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(74,63,75,.03) 1px,transparent 1px),
    radial-gradient(1400px 900px at 88% -10%,#FFFBFD 0%,rgba(255,251,253,0) 60%),
    radial-gradient(1200px 900px at -6% 2%,#F1DEE8 0%,rgba(241,222,232,0) 60%),
    linear-gradient(180deg,#F5E9EF 0%,#F7F1F4 46%,#F4EBF0 100%);
  background-size:26px 26px,26px 26px,auto,auto,auto;
  background-attachment:fixed;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--ink);text-decoration:none}
::selection{background:var(--rose);color:var(--ink)}
svg{display:block}
.tnum{font-variant-numeric:tabular-nums}
.micro{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-3);font-weight:600;font-family:var(--f-mono)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}

/* ---------- 左侧导航 ---------- */
.rail{
  position:fixed;left:0;top:0;bottom:0;width:238px;z-index:40;
  display:flex;flex-direction:column;padding:22px 14px 18px;
  background:#FFFFFF;border-right:1px solid var(--line);
}
.rail-brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px}
.mark{
  width:36px;height:36px;flex:none;border-radius:12px;background:var(--ink);color:#FFF;
  display:grid;place-items:center;font-size:15px;font-weight:600;letter-spacing:0;
}
.rail-brand b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.rail-brand small{display:block;font-family:var(--f-mono);font-size:8px;letter-spacing:.18em;color:var(--ink-3);margin-top:3px}
.rail-sec{padding:0 12px 9px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:12px;
  color:var(--ink-2);font-size:13.5px;text-align:left;transition:background .16s,color .16s;
}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.72}
.nav-item:hover{background:#f9f2f5;color:var(--ink)}
.nav-item.is-on{background:var(--ink);color:#FFF;font-weight:500}
.nav-item.is-on svg{opacity:1}
.nav-badge{
  margin-left:auto;font-family:var(--f-mono);font-size:10px;line-height:1;
  padding:3px 5px;border-radius:5px;background:var(--paper-2);color:var(--ink-3);
}
.nav-item.is-on .nav-badge{background:rgba(255,255,255,.16);color:#fff}
.nav-badge:empty{display:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px}
.rail-sugar{
  position:relative;overflow:hidden;border-radius:16px;padding:14px;background:var(--dark);color:#fff;
}
.rail-sugar::after{content:"";position:absolute;right:-30px;top:-34px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,rgba(240,217,228,.35),rgba(240,217,228,0) 70%)}
.rail-sugar .rs-l{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.18em;opacity:.6}
.rail-sugar .rs-n{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:4px}
.rail-sugar .rs-n small{font-size:10px;font-weight:400;opacity:.6;margin-left:3px;letter-spacing:0}
.rail-sugar .rs-b{height:3px;border-radius:99px;background:rgba(255,255,255,.15);margin-top:10px;overflow:hidden}
.rail-sugar .rs-b i{display:block;height:100%;background:#fff;border-radius:99px}
.rail-tip{font-size:10.5px;line-height:1.8;color:var(--ink-3);padding:2px 6px}
.rail-tip b{color:var(--ink-2);font-weight:500}
.rail-swatches{display:flex;gap:5px;padding:4px 8px 0}
.rail-swatches i{width:13px;height:13px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(74,63,75,.1)}

/* ---------- 主区域 ---------- */
.main{margin-left:238px;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:16px 34px;background:rgba(244,233,238,.82);backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid transparent;
}
.topbar-l{display:flex;align-items:center;gap:12px;min-width:0}
.ptitle{font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.psub{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.searchbox{
  display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:var(--ink-3);font-size:12.5px;
  min-width:280px;box-shadow:var(--sh-1);transition:border-color .16s,box-shadow .16s;
}
.searchbox:hover{border-color:rgba(74,63,75,.18)}
.searchbox svg{width:15px;height:15px;flex:none}
.searchbox .sb-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbox kbd{
  margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;line-height:1.5;
}
.iconbtn{
  width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;
  border:1px solid transparent;color:var(--ink-2);transition:background .16s,color .16s;
}
.iconbtn:hover{background:#fff;border-color:var(--line);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}
.cloud-chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.84);font-size:10.5px;color:var(--ink-2);
  white-space:nowrap;cursor:pointer;user-select:none;transition:border-color .16s,background .16s,color .16s;
}
.cloud-chip:hover{background:#fff;border-color:rgba(74,63,75,.22);color:var(--ink)}
.cloud-chip i{width:6px;height:6px;border-radius:50%;background:#c1a0ac;flex:none}
.cloud-chip.ok i{background:#4a3f4b}
.cloud-chip.dirty i{background:#806c79}
.cloud-chip.err i{background:#b85c74}
.cloud-chip.busy i{background:#c1a0ac;animation:supaPulse 1s infinite ease-in-out}
@keyframes supaPulse{0%,100%{transform:scale(.82);opacity:.45}50%{transform:scale(1.25);opacity:1}}
.page{width:100%;max-width:1300px;padding:6px 34px 90px;flex:1}
.page-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 34px 28px;font-size:10.5px;color:var(--ink-3);font-family:var(--f-mono);
  letter-spacing:.04em;
}
.page-foot button{color:var(--ink-3);font-family:var(--f-mono);font-size:10.5px}
.page-foot button:hover{color:var(--ink)}

/* ---------- 通用组件 ---------- */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-1);
}
.card-h{display:flex;align-items:center;gap:9px;padding:18px 20px 0}
.card-h .ch-ic{width:17px;height:17px;color:var(--ink-2);flex:none}
.card-h .ch-ic svg{width:100%;height:100%}
.card-t{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.card-t small{font-weight:400;color:var(--ink-3);font-size:11px;margin-left:6px;letter-spacing:0}
.card-act{margin-left:auto;display:flex;align-items:center;gap:6px}
.card-b{padding:14px 20px 20px}
.hair{height:1px;background:var(--line-2)}
.link{font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;padding:4px 2px;border-radius:6px}
.link:hover{color:var(--ink)}
.link svg{width:13px;height:13px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;
  border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;
  transition:background .16s,transform .12s,border-color .16s,box-shadow .16s;
}
.btn:hover{background:#f9f2f5}
.btn:active{transform:scale(.985)}
.btn svg{width:15px;height:15px;flex:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 10px 22px -18px rgba(74,63,75,.9)}
.btn.primary:hover{background:#5a4c58}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:#f7eef3;color:var(--ink)}
.btn.sm{height:32px;padding:0 11px;font-size:12px;border-radius:10px;gap:5px}
.btn.sm svg{width:13px;height:13px}
.btn.del{color:#8f6070;border-color:#e4cedb}
.btn.del:hover{background:#faeff5}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:12px;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.pill:hover{border-color:rgba(74,63,75,.2);color:var(--ink)}
.pill.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill .pdot{width:6px;height:6px;border-radius:50%;flex:none}
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;line-height:1.5;padding:2px 7px;
  border-radius:6px;background:#f7eef3;color:var(--ink-2);white-space:nowrap;
}
.tag.rose{background:#f7ebf2;color:#8a5f6d}
.tag.sage{background:#efe9ee;color:#6e5b68}
.tag.sand{background:#f5edf1;color:#7c6874}
.tag.ghost{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
.empty{
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  padding:30px 18px;color:var(--ink-3);font-size:12.5px;line-height:1.7;
}
.empty b{font-size:13.5px;color:var(--ink-2);font-weight:500}
.empty svg{width:26px;height:26px;opacity:.4}
.muted{color:var(--ink-3);font-size:12px;line-height:1.65}

/* ---------- 今日：Bento ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.span-12{grid-column:span 12}
.span-8{grid-column:span 8}
.span-7{grid-column:span 7}
.span-5{grid-column:span 5}
.span-4{grid-column:span 4}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.span-7.col,.span-5.col{grid-column:span 7}
.span-5.col{grid-column:span 5}

.hero{
  grid-column:span 8;position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;
  padding:26px 28px;min-height:196px;
  background:linear-gradient(135deg,#FDF6FA 0%,#FFFFFF 56%,#FBF0F6 100%);
}
.hero::before{
  content:"";position:absolute;right:-60px;top:-90px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,217,228,.72) 0%,rgba(240,217,228,0) 66%);
}
.hero::after{
  content:"";position:absolute;left:18px;bottom:-26px;width:220px;height:110px;opacity:.5;
  background-image:radial-gradient(circle at 1.6px 1.6px,rgba(74,63,75,.16) 1.6px,transparent 0);
  background-size:9px 9px;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,#000,rgba(46,37,48,0));mask-image:linear-gradient(90deg,#000,rgba(46,37,48,0));
}
.hero-txt{position:relative;z-index:1;flex:1;min-width:0}
.hero-eye{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.hero-eye .bar{width:16px;height:1px;background:var(--ink);opacity:.5}
.hero-eye .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.hero-eye span{font-size:10.5px;color:var(--ink-2);letter-spacing:.02em}
.hero h2{
  font-family:var(--f-serif);
  font-size:28px;line-height:1.32;letter-spacing:.012em;font-weight:600;margin:11px 0 8px;
}
.hero h2 em{
  font-style:normal;white-space:nowrap;padding-bottom:4px;
  background-image:linear-gradient(0deg,rgba(143,107,125,.38),rgba(143,107,125,.38));
  background-repeat:no-repeat;background-size:100% 2px;background-position:0 calc(100% - 2px);
}
.hero p{font-size:12px;color:var(--ink-2);max-width:330px;line-height:1.7;text-wrap:pretty}
.hero-side{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:9px;flex:none}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring-n{font-size:30px;font-weight:600;letter-spacing:-.04em}
.ring-n small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.ring-l{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink-3);margin-top:5px;text-transform:uppercase}
.hero-hint{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3)}

/* 糖分卡 */
.sugar{
  grid-column:span 4;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  padding:22px 22px 20px;border-radius:var(--r);color:#fff;border:0;
  background:linear-gradient(158deg,#3a2f3d 0%,#2b2330 58%,#221b24 100%);
  box-shadow:0 24px 44px -36px rgba(74,63,75,.9);min-height:196px;
}
.sugar::before{
  content:"";position:absolute;right:-40px;top:-70px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,217,228,.34) 0%,rgba(240,217,228,0) 68%);
}
.sugar::after{
  content:"";position:absolute;right:14px;bottom:52px;width:64px;height:40px;opacity:.5;
  background-image:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.4) 1.5px,transparent 0);
  background-size:7px 7px;
}
.sugar-top{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sugar .micro{color:rgba(255,255,255,.5)}
.sugar-ic{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.72);
}
.sugar-ic svg{width:15px;height:15px}
.sugar-num{position:relative;z-index:1;font-size:44px;font-weight:600;letter-spacing:-.045em;line-height:1;margin:14px 0 6px}
.sugar-num small{font-size:12px;font-weight:400;opacity:.55;margin-left:6px;letter-spacing:.04em}
.sugar-sub{position:relative;z-index:1;font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.02em}
.sugar-foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.sugar-bar{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.sugar-bar i{display:block;height:100%;background:#fff;border-radius:99px}
.sugar-btn{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:10.5px;
}
.sugar-btn:hover{background:rgba(255,255,255,.18)}
.sugar-btn svg{width:12px;height:12px}

/* 周条 */
.week{grid-column:span 12;display:flex;align-items:center;gap:18px;padding:14px 18px}
.week-l{flex:1;min-width:0}
.week-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.week-nav{margin-left:auto;display:flex;gap:2px}
.week-nav button{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3)}
.week-nav button:hover{background:var(--paper-2);color:var(--ink)}
.week-nav svg{width:14px;height:14px}
.week-days{display:flex;gap:5px}
.wk-day{
  position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 2px 7px;border-radius:13px;border:1px solid transparent;transition:background .16s,border-color .16s;
}
.wk-day:hover{background:#f9f2f5}
.wk-day .wd{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3)}
.wk-day .wn{font-size:14px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wk-day .wdot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:2px}
.wk-day.has .wdot{background:var(--ink-3)}
.wk-day.is-today{border-color:var(--line)}
.wk-day.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.wk-day.is-on .wd{color:rgba(255,255,255,.6)}
.wk-day.is-on .wdot{background:#fff}
.wk-day.is-on.has .wdot{background:#fff}
.week-stats{display:flex;gap:18px;flex:none;padding-left:18px;border-left:1px solid var(--line-2)}
.wstat b{display:block;font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.wstat span{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}

/* 习惯 */
.habits{padding-bottom:8px}
.habit-list{padding:6px 10px 8px}
.habit{
  position:relative;display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:14px;
  cursor:pointer;transition:background .16s;overflow:hidden;
}
.habit:hover{background:#faf3f7}
.habit + .habit::before{content:"";position:absolute;left:10px;right:10px;top:0;height:1px;background:var(--line-2)}
.h-ic{
  width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;
  color:color-mix(in srgb,var(--hue) 62%,#4a3f4b);background:color-mix(in srgb,var(--hue) 18%,#fff);
  border:1px solid color-mix(in srgb,var(--hue) 28%,transparent);transition:background .2s;
}
.h-ic svg{width:18px;height:18px}
.h-main{flex:1;min-width:0}
.h-name{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;letter-spacing:-.005em}
.h-name>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-meta{font-size:10.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.h-meta .sep{width:2px;height:2px;border-radius:50%;background:var(--ink-4)}
.h-edit{
  width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--ink-4);
  opacity:0;transition:opacity .15s,background .15s;
}
.habit:hover .h-edit{opacity:1}
.h-edit:hover{background:var(--paper-2);color:var(--ink)}
.h-edit svg{width:12px;height:12px}
.h-check{
  width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(74,63,75,.16);background:#fff;color:#C0C0C7;
  transition:background .18s,border-color .18s,color .18s,transform .18s;
}
.h-check svg{width:14px;height:14px}
.habit:hover .h-check{border-color:rgba(74,63,75,.28);color:var(--ink-2)}
.habit.is-done{background:#FBFAF8}
.habit.is-done .h-ic{background:#f7eef3;color:var(--ink-3);border-color:transparent}
.habit.is-done .h-name>span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.habit.is-done .h-check{background:var(--ink);border-color:var(--ink);color:#fff;animation:popIn .32s cubic-bezier(.2,1.4,.4,1)}
.stamp{
  position:absolute;right:44px;top:50%;transform:translateY(-50%) rotate(-8deg);pointer-events:none;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.22em;color:var(--sage);
  border:1px solid var(--sage);border-radius:5px;padding:2px 5px;opacity:0;
}
.habit.is-done .stamp{opacity:.55}
.habit.is-stamping .stamp{animation:stampIn .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes stampIn{0%{opacity:0;transform:translateY(-50%) rotate(-16deg) scale(1.7)}40%{opacity:.9;transform:translateY(-50%) rotate(-6deg) scale(.94)}100%{opacity:.55;transform:translateY(-50%) rotate(-8deg) scale(1)}}
@keyframes popIn{0%{transform:scale(.6);opacity:.4}100%{transform:scale(1);opacity:1}}
.habit-prog{display:flex;align-items:center;gap:10px;padding:2px 20px 12px}
.habit-prog .track{flex:1;height:3px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.habit-prog .track i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}
.habit-prog span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3)}

/* 本周节奏柱状 */
.chart{display:flex;align-items:flex-end;gap:10px;height:92px;padding:0 2px;border-bottom:1px solid var(--line-2)}
.chart .cbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart .cbar .tr{position:relative;width:100%;flex:1;border-radius:5px;overflow:hidden}
.chart .cbar .tr i{position:absolute;left:0;right:0;bottom:0;background:#c1a0ac;border-radius:5px;transition:height .4s;min-height:3px}
.chart .cbar.is-today .tr i{background:var(--ink)}
.chart-x{display:flex;gap:8px;margin-top:7px;padding:0 2px}
.chart-x span{flex:1;text-align:center;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;color:var(--ink-3)}
.chart-x span.is-today{color:var(--ink);font-weight:700}

/* 快捷操作 */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qbtn{
  display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:12px;border-radius:14px;
  border:1px solid transparent;text-align:left;transition:background .16s,border-color .16s;
}
.qbtn:hover{background:#faf3f7;border-color:var(--line-2)}
.qbtn .qi{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:#f7eef3;color:var(--ink-2);
}
.qbtn .qi svg{width:15px;height:15px}
.qbtn b{font-size:11.5px;font-weight:500;letter-spacing:-.005em}
.qbtn span{font-size:9.5px;color:var(--ink-3);margin-top:-7px}

/* 连续 */
.streak{display:flex;flex-direction:column;gap:2px}
.streak-num{font-size:40px;font-weight:600;letter-spacing:-.05em;line-height:1.05}
.streak-num small{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:5px;letter-spacing:.02em}
.streak-dots{display:flex;gap:4px;margin-top:12px}
.streak-dots i{flex:1;height:18px;border-radius:5px;background:#f4e9ee;position:relative;overflow:hidden}
.streak-dots i.on{background:var(--ink)}
.streak-dots i.today{outline:1px solid var(--ink);outline-offset:1px}

/* 提示 */
.remind{background:#fcf7fa;border-style:dashed}
.remind .rm-q{font-family:Georgia,serif;font-size:26px;line-height:1;color:var(--ink-4);margin-bottom:4px}
.remind p{font-size:12px;color:var(--ink-2);line-height:1.8;text-wrap:pretty}
.remind-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.remind-foot button{font-size:10px;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.remind-foot button:hover{color:var(--ink)}

/* 时间线 */
.tl{display:flex;flex-direction:column;padding:2px 0}
.tl-row{display:grid;grid-template-columns:46px 1fr 30px;gap:12px;align-items:center;padding:9px 0;border-radius:10px}
.tl-row:hover{background:#FBFAF9}
.tl-time{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.02em;color:var(--ink-3);text-align:right;line-height:1.4}
.tl-time.late{color:var(--rose-2);font-weight:600}
.tl-body{position:relative;padding-left:14px;min-width:0;border-left:1px solid var(--line)}
.tl-body::before{
  content:"";position:absolute;left:-3.5px;top:7px;width:6px;height:6px;border-radius:50%;
  background:#fff;border:1.5px solid var(--ink-4);
}
.tl-row.is-done .tl-body::before{background:var(--ink);border-color:var(--ink)}
.tl-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.tl-row.is-done .tl-name{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.tl-meta{font-size:10px;color:var(--ink-3);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tl-check{
  width:26px;height:26px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);
  color:var(--ink-4);justify-self:end;
}
.tl-check:hover{border-color:var(--ink);color:var(--ink)}
.tl-check svg{width:12px;height:12px}
.tl-row.is-done .tl-check{background:var(--ink);border-color:var(--ink);color:#fff}

/* 收集预览 */
.peek{grid-column:span 12}
.peek-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:14px}
.peek-item{
  text-align:left;padding:13px 14px;border-radius:14px;border:1px solid var(--line-2);
  display:flex;flex-direction:column;gap:8px;background:#fefbfc;transition:background .16s,border-color .16s;
}
.peek-item:hover{background:#fff;border-color:var(--line)}
.peek-text{font-size:12px;line-height:1.6;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.peek-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.peek-date{font-family:var(--f-mono);font-size:9px;color:var(--ink-3)}
.peek-empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;font-size:12px;color:var(--ink-3)}

/* ---------- 看板 ---------- */
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.filters .fl-sep{width:1px;height:18px;background:var(--line);margin:0 2px}
.filters .fl-label{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink-3);margin-right:2px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.bcol{
  display:flex;flex-direction:column;
  border-radius:var(--r);border:1px solid var(--line);background:rgba(255,255,255,.55);
  padding:10px;min-height:390px;transition:background .16s,border-color .16s;
}
.bcol.drop{background:#fbf2f7;border-color:var(--rose-2)}
.bcol-h{display:flex;align-items:center;gap:8px;padding:6px 7px 10px}
.bcol-h .bh-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.bcol-h .bh-t{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.bcol-h .bh-n{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);padding:1px 5px;border-radius:5px;background:var(--paper-2)}
.badd{margin-left:auto;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;color:var(--ink-3)}
.badd:hover{background:var(--paper-2);color:var(--ink)}
.badd svg{width:13px;height:13px}
.tcard{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;
  margin-bottom:8px;box-shadow:var(--sh-1);cursor:grab;transition:box-shadow .16s,transform .16s,border-color .16s;
}
.tcard:hover{box-shadow:0 16px 30px -26px rgba(74,63,75,.6);border-color:rgba(74,63,75,.14);transform:translateY(-1px)}
.tcard.dragging{opacity:.45;cursor:grabbing}
.tcard-name{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;font-weight:500;line-height:1.5;letter-spacing:-.005em;word-break:break-word}
.tcard-name .tdot{width:5px;height:5px;border-radius:50%;flex:none;margin-top:6px;background:var(--hue)}
.tcard-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tcard-tags .tag{cursor:pointer}
.tcard-tags .tag.add{padding:2px 6px;background:transparent;border:1px dashed var(--line);color:var(--ink-4)}
.tcard-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:9px;font-family:var(--f-mono);font-size:9px;color:var(--ink-3);letter-spacing:.02em}
.tcard-meta .late{color:var(--rose-2);font-weight:700}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line-2)}
.tcard-foot .tf-p{font-size:9.5px;color:var(--ink-3);display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard-foot .tf-p i{width:5px;height:5px;border-radius:50%;background:var(--hue);flex:none}
.mini-acts{display:flex;gap:3px;flex:none}
.mini-acts button{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-3);background:#fff}
.mini-acts button:hover{background:var(--paper-2);color:var(--ink)}
.mini-acts svg{width:11px;height:11px}
.bempty{border:1px dashed var(--line);border-radius:14px;padding:20px 10px;text-align:center;font-size:11px;color:var(--ink-4)}

/* ---------- 收集箱 ---------- */
.capture{padding:16px}
.capture textarea{
  width:100%;min-height:82px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
  background:#fefbfc;font-size:13px;line-height:1.7;resize:vertical;outline:none;transition:border-color .16s,background .16s;
}
.capture textarea:focus{border-color:rgba(74,63,75,.3);background:#fff}
.capture-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.inbox-wrap{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.inbox-left{position:sticky;top:84px}
.inbox-left .capture textarea{min-height:132px}
.inbox-right{min-width:0}
.inbox-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.capture-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.idea{
  position:relative;display:flex;flex-direction:column;gap:10px;padding:15px 15px 12px;border-radius:18px;
  border:1px solid var(--line);background:#fff;box-shadow:var(--sh-1);min-height:112px;transition:box-shadow .18s,transform .18s;
}
.idea:hover{box-shadow:0 18px 32px -30px rgba(74,63,75,.55);transform:translateY(-1px)}
.idea.is-done{background:#fcf7fa}
.idea.is-done .idea-text{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.idea-text{font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.idea-meta{display:flex;align-items:center;gap:7px;margin-top:auto;flex-wrap:wrap}
.idea-date{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);letter-spacing:.02em}
.idea-tools{display:flex;gap:4px;opacity:.55;transition:opacity .16s}
.idea:hover .idea-tools{opacity:1}
.idea-tools button{
  width:25px;height:25px;display:grid;place-items:center;border-radius:7px;
  border:1px solid var(--line-2);color:var(--ink-2);background:#fff;
}
.idea-tools button:hover{background:var(--paper-2);color:var(--ink)}
.idea-tools svg{width:11px;height:11px}

/* ---------- 项目 ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.proj{overflow:hidden;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh-1);display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.proj:hover{box-shadow:0 24px 44px -36px rgba(74,63,75,.6);transform:translateY(-2px)}
.proj-cover{
  position:relative;height:84px;padding:15px 16px;display:flex;align-items:flex-start;gap:11px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--hue) 20%,#fff) 0%,color-mix(in srgb,var(--hue) 5%,#fff) 62%,#fff 100%);
}
.proj-cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 1.4px 1.4px,rgba(74,63,75,.16) 1.4px,transparent 0);
  background-size:9px 9px;
  -webkit-mask-image:linear-gradient(115deg,transparent 42%,#000 100%);mask-image:linear-gradient(115deg,transparent 42%,#000 100%);
}
.proj-mark{
  position:relative;z-index:1;width:38px;height:38px;flex:none;border-radius:12px;background:#fff;
  display:grid;place-items:center;color:color-mix(in srgb,var(--hue) 55%,#4a3f4b);
  box-shadow:0 8px 18px -14px rgba(74,63,75,.5);
}
.proj-mark svg{width:18px;height:18px}
.proj-titles{position:relative;z-index:1;flex:1;min-width:0;padding-top:1px}
.proj-name{font-size:15px;font-weight:600;letter-spacing:-.02em}
.proj-sub{font-size:10px;color:var(--ink-2);margin-top:3px;font-family:var(--f-mono);letter-spacing:.02em}
.proj-pct{position:relative;z-index:1;text-align:right;font-size:21px;font-weight:600;letter-spacing:-.04em;color:var(--ink)}
.proj-pct small{font-size:10px;color:var(--ink-3);margin-left:1px}
.proj-bar{height:3px;background:var(--paper-2);margin:0 16px;border-radius:99px;overflow:hidden}
.proj-bar i{display:block;height:100%;background:color-mix(in srgb,var(--hue) 62%,#4a3f4b);border-radius:99px;transition:width .4s}
.proj-tasks{padding:10px 8px 4px;flex:1}
.ptask{
  display:flex;align-items:center;gap:9px;padding:9px 9px;border-radius:10px;cursor:pointer;
}
.ptask:hover{background:#faf3f7}
.ptask .pc{
  width:17px;height:17px;flex:none;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:transparent;
}
.ptask .pc svg{width:9px;height:9px}
.ptask.is-done .pc{background:var(--ink);border-color:var(--ink);color:#fff}
.ptask-name{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptask.is-done .ptask-name{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.ptask-when{font-family:var(--f-mono);font-size:8.5px;color:var(--ink-3);white-space:nowrap}
.ptask-when.late{color:var(--rose-2)}
.proj-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line-2);margin-top:4px}
.proj-foot .pf-l{display:flex;align-items:center;gap:6px}
.proj-foot .pf-l button{
  width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line-2);color:var(--ink-2);background:#fff;
}
.proj-foot .pf-l button:hover{background:var(--paper-2);color:var(--ink)}
.proj-foot svg{width:12px;height:12px}
.newproj{
  min-height:280px;border:1px dashed rgba(74,63,75,.16);border-radius:var(--r);background:rgba(255,255,255,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-3);
  font-size:12px;transition:background .16s,border-color .16s;
}
.newproj:hover{background:#fff;border-color:rgba(74,63,75,.28);color:var(--ink-2)}
.newproj .np-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--line)}
.newproj svg{width:16px;height:16px}

/* 项目详情 */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.dh-main{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.dh-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--hue) 16%,#fff);color:color-mix(in srgb,var(--hue) 55%,#4a3f4b);border:1px solid color-mix(in srgb,var(--hue) 22%,transparent)}
.dh-ic svg{width:20px;height:20px}
.dh-name{font-size:21px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.dh-sub{font-size:10.5px;color:var(--ink-3);margin-top:4px;font-family:var(--f-mono);letter-spacing:.02em}
.detail-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.pd-side{grid-column:span 4;display:flex;flex-direction:column;gap:16px}
.pd-main{grid-column:span 8}
.pd-top{display:flex;align-items:center;gap:16px}
.pd-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;flex:1}
.pd-kv span{display:block;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.pd-kv b{font-size:14px;font-weight:600;letter-spacing:-.02em;margin-top:2px;display:block}
.pd-task{display:flex;align-items:center;gap:10px;padding:11px 6px;border-radius:10px;cursor:pointer;transition:background .16s}
.pd-task:hover{background:#faf3f7}
.pd-task + .pd-task{border-top:1px solid var(--line-2)}
.pd-task .pc{width:20px;height:20px;flex:none;border-radius:50%;border:1px solid rgba(74,63,75,.16);background:#fff;display:grid;place-items:center;color:transparent;transition:border-color .15s,background .15s}
.pd-task .pc:hover{border-color:var(--ink)}
.pd-task .pc svg{width:10px;height:10px}
.pd-task.is-done .pc{background:var(--ink);border-color:var(--ink);color:#fff}
.pd-task-body{flex:1;min-width:0}
.pd-task-name{font-size:12.5px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-task.is-done .pd-task-name{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.pd-task-meta{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.pd-task-meta .late{color:var(--rose-2)}
.pd-del{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--ink-4);opacity:0}
.pd-task:hover .pd-del{opacity:1}
.pd-del:hover{background:#faeff5;color:var(--rose-2)}
.pd-del svg{width:12px;height:12px}
.ms{display:flex;align-items:center;gap:10px;padding:10px 4px}
.ms + .ms{border-top:1px solid var(--line-2)}
.ms .mc{width:18px;height:18px;flex:none;border-radius:6px;border:1px solid rgba(74,63,75,.16);background:#fff;display:grid;place-items:center;color:transparent}
.ms .mc svg{width:10px;height:10px}
.ms.is-done .mc{background:var(--ink);border-color:var(--ink);color:#fff}
.ms-body{flex:1;min-width:0}
.ms-name{font-size:12px;line-height:1.45}
.ms.is-done .ms-name{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.ms-date{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);margin-top:2px}
.pd-note{width:100%;min-height:90px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fefbfc;font-size:12px;line-height:1.75;resize:vertical;outline:none}
.pd-note:focus{border-color:rgba(74,63,75,.3);background:#fff}

/* ---------- 统计 ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.tile{padding:17px 18px 16px}
.tile-label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile-label svg{width:14px;height:14px;color:var(--ink-3)}
.tile-num{font-size:33px;font-weight:600;letter-spacing:-.045em;line-height:1.1;margin-top:9px}
.tile-num small{font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.tile-sub{font-size:10.5px;color:var(--ink-3);margin-top:6px;display:flex;align-items:center;gap:5px}
.tile-sub b{color:var(--ink-2);font-weight:500}
.tile-bar{height:3px;border-radius:99px;background:var(--paper-2);margin-top:10px;overflow:hidden}
.tile-bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.stats-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.sg-left{grid-column:span 7;display:flex;flex-direction:column;gap:16px}
.sg-right{grid-column:span 5;display:flex;flex-direction:column;gap:16px}
.chart14{display:flex;align-items:flex-end;gap:5px;height:124px;padding:4px 0 0;border-bottom:1px solid var(--line-2)}
.chart14 .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart14 .b i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:#c1a0ac;min-height:2px;transition:height .4s}
.chart14 .b.is-today i{background:var(--ink)}
.chart14 .b.is-empty i{background:#eadce3}
.chart14-x{display:flex;gap:5px;margin-top:8px}
.chart14-x span{flex:1;text-align:center;font-family:var(--f-mono);font-size:7.5px;color:var(--ink-3);letter-spacing:0;overflow:hidden}
.habit-stat{display:flex;align-items:center;gap:11px;padding:10px 0}
.habit-stat + .habit-stat{border-top:1px solid var(--line-2)}
.hs-ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--hue) 12%,#fff);color:color-mix(in srgb,var(--hue) 50%,#4a3f4b);border:1px solid color-mix(in srgb,var(--hue) 18%,transparent)}
.hs-ic svg{width:15px;height:15px}
.hs-body{flex:1;min-width:0}
.hs-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hs-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs-val{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);white-space:nowrap}
.hs-bar{height:3px;border-radius:99px;background:var(--paper-2);margin-top:6px;overflow:hidden}
.hs-bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.week-note{width:100%;min-height:92px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fefbfc;font-size:12px;line-height:1.8;resize:vertical;outline:none}
.week-note:focus{border-color:rgba(74,63,75,.3);background:#fff}
.hm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:4px}
.hm-wd{font-family:var(--f-mono);font-size:8px;color:var(--ink-3);text-align:center;padding-bottom:3px;letter-spacing:.05em}
.hm-c{
  height:46px;border-radius:7px;background:#f4e9ee;position:relative;
  display:flex;align-items:flex-start;justify-content:flex-start;padding:6px 7px;
  transition:transform .14s,box-shadow .14s;
}
.hm-c:hover{transform:translateY(-1px);box-shadow:0 6px 12px -8px rgba(74,63,75,.45)}
.hm-c.out{background:transparent;pointer-events:none}
.hm-c.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);pointer-events:none}
.hm-c.future .hday{opacity:.3}
.hm-c.is-today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.hm-c .hday{font-family:var(--f-mono);font-size:9px;opacity:.6;line-height:1}
.hm-c:hover .hday{opacity:1}
.hm-legend{display:flex;align-items:center;gap:5px;margin-top:12px;justify-content:flex-end}
.hm-legend span{font-family:var(--f-mono);font-size:8px;color:var(--ink-3);letter-spacing:.06em}
.hm-legend i{width:10px;height:10px;border-radius:3px;background:#f4e9ee}
.points{position:relative;overflow:hidden;border-radius:var(--r);padding:22px;color:#fff;border:0;
  background:linear-gradient(152deg,#382d3a 0%,#2e2530 58%,#221b24 100%);
  box-shadow:0 24px 44px -36px rgba(74,63,75,.9)}
.points::before{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,217,228,.3),rgba(240,217,228,0) 70%)}
.points::after{content:"";position:absolute;left:22px;bottom:16px;width:120px;height:44px;opacity:.4;
  background-image:radial-gradient(circle at 1.4px 1.4px,rgba(255,255,255,.4) 1.4px,transparent 0);background-size:7px 7px;
  -webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent)}
.points .micro{color:rgba(255,255,255,.45)}
.points-num{font-size:46px;font-weight:600;letter-spacing:-.05em;line-height:1.05;margin-top:10px}
.points-num small{font-size:12px;font-weight:400;opacity:.55;margin-left:6px;letter-spacing:.04em}
.points-sub{font-size:10.5px;color:rgba(255,255,255,.55);margin-top:8px;position:relative;z-index:1}
.rewards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.reward{position:relative;display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:16px;border:1px solid var(--line);background:#fff}
.reward:hover{border-color:rgba(74,63,75,.16)}
.reward-emo{
  width:100%;height:56px;border-radius:11px;display:grid;place-items:center;font-size:25px;
  background:linear-gradient(135deg,#f9f0f4,#f4e8ee);border:1px solid var(--line-2);
}
.reward-name{font-size:12px;font-weight:500;line-height:1.4;padding:0 1px}
.reward-need{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);display:flex;align-items:center;gap:3px}
.reward-btn{width:100%;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--ink)}
.reward-btn:hover{background:var(--paper-2)}
.reward-btn:disabled{opacity:.4;cursor:not-allowed}
.reward-del{position:absolute;right:7px;top:7px;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:var(--ink-3);background:rgba(255,255,255,.85);border:1px solid var(--line-2);opacity:0;transition:opacity .15s}
.reward:hover .reward-del{opacity:1}
.reward-del:hover{color:var(--rose-2);border-color:#e4cedb}
.reward-del svg{width:11px;height:11px}
.hist{display:flex;flex-direction:column}
.hist-row{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:11.5px}
.hist-row + .hist-row{border-top:1px solid var(--line-2)}
.hist-row .hn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .hc{font-family:var(--f-mono);font-size:9.5px;color:var(--rose-2)}
.hist-row .ht{font-family:var(--f-mono);font-size:9px;color:var(--ink-3)}

/* ---------- 数据页 ---------- */
.datagrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.dc-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.dcard{padding:20px}
.dcard h3{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.dcard h3 svg{width:16px;height:16px;flex:none;color:var(--ink-2)}
.dcard h3 .tag{margin-left:auto}
.dcard .desc{font-size:11.5px;color:var(--ink-2);line-height:1.75;margin:8px 0 14px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:11px;color:var(--ink-2);margin-bottom:6px;letter-spacing:.01em}
.field input,.field textarea,.field select{
  width:100%;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line);
  background:#fefbfc;font-size:12.5px;outline:none;transition:border-color .16s,background .16s,box-shadow .16s;
}
.field textarea{height:auto;min-height:92px;padding:11px 12px;line-height:1.7;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(74,63,75,.32);background:#fff;box-shadow:0 0 0 3px rgba(74,63,75,.045)}
.field .hint{display:block;font-size:10px;color:var(--ink-3);margin-top:5px;line-height:1.6}
.check-line{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);margin:2px 0 14px;cursor:pointer;user-select:none}
.check-line input{width:15px;height:15px;accent-color:var(--ink);cursor:pointer;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px}
.status{
  display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border-radius:11px;border:1px solid var(--line);
  background:#fcf7fa;font-size:11px;color:var(--ink-2);line-height:1.6;margin-bottom:14px;
}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none;margin-top:6px}
.status.ok i{background:var(--ink)}
.status.err i{background:#b85c74}
.status.busy i{background:var(--sand)}
pre.sql{
  margin:10px 0 0;padding:12px;border-radius:11px;background:#f9f2f5;border:1px solid var(--line-2);
  font-family:var(--f-mono);font-size:10.5px;line-height:1.7;overflow:auto;color:var(--ink-2);white-space:pre;
}
details{border-top:1px solid var(--line-2);margin-top:14px;padding-top:12px}
summary{cursor:pointer;font-size:11.5px;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:7px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";width:15px;height:15px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;font-size:10px;color:var(--ink-3);flex:none}
details[open] summary::before{content:"−"}
.scan{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line-2);border-radius:11px;margin-top:8px;font-size:11.5px;background:#fefbfc}
.scan .sk{flex:1;min-width:0}
.scan .sk b{display:block;font-size:12px;font-weight:500;margin-bottom:1px}
.scan .sk small{font-family:var(--f-mono);font-size:9px;color:var(--ink-3)}
.scan .h-ic{width:30px;height:30px;border-radius:9px}
.scan .h-ic svg{width:14px;height:14px}
.danger{border-color:#e6d4de;background:#fdf8fb}
.danger h3{color:#8a5f6e}
.danger h3 svg{color:#9a7080}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px}
.modal.is-open{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(74,63,75,.32);backdrop-filter:blur(8px)}
.modal-box{
  position:relative;width:100%;max-width:460px;max-height:88vh;overflow:auto;
  background:#fff;border-radius:26px;padding:22px;
  box-shadow:0 40px 90px -40px rgba(46,37,48,.5);animation:sheetUp .26s cubic-bezier(.2,.9,.3,1);
}
@keyframes sheetUp{from{transform:translateY(16px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal-h h3{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.modal-h p{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.6}
.modal-x{margin-left:auto;width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--ink-3);background:var(--paper)}
.modal-x:hover{background:var(--paper-2);color:var(--ink)}
.modal-x svg{width:14px;height:14px}
.modal-actions{display:flex;gap:8px;margin-top:18px;align-items:center}
.modal-actions .btn{flex:1}
.modal-actions .btn.del{flex:none;width:44px;padding:0}
.icon-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.icon-pick button{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:#fefbfc;color:var(--ink-2)}
.icon-pick button svg{width:18px;height:18px}
.icon-pick button.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.color-pick{display:flex;flex-wrap:wrap;gap:8px}
.color-pick button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.color-pick button.is-on{border-color:var(--ink);transform:scale(1.05)}
.emo-pick{display:flex;flex-wrap:wrap;gap:6px}
.emo-pick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fefbfc;font-size:18px;display:grid;place-items:center}
.emo-pick button.is-on{border-color:var(--ink);background:var(--paper)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--paper);border:1px solid var(--line-2);gap:2px}
.seg button{height:30px;padding:0 13px;border-radius:8px;font-size:11.5px;color:var(--ink-2)}
.seg button.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(74,63,75,.08);font-weight:500}
.proj-pick{display:flex;flex-wrap:wrap;gap:6px}
.proj-pick button{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:8px;
  border:1px solid var(--line);background:#fefbfc;font-size:11.5px;color:var(--ink-2);
}
.proj-pick button i{width:5px;height:5px;border-radius:50%;background:var(--hue)}
.proj-pick button.is-on{border-color:var(--ink);color:var(--ink);background:var(--paper)}

/* 标签编辑 / 管理 */
.tag-editor{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 8px;min-height:42px;
  border:1px solid var(--line);border-radius:11px;background:#FEFBFD;transition:border-color .15s,box-shadow .15s;
}
.tag-editor:focus-within{border-color:rgba(74,63,75,.3);background:#fff;box-shadow:0 0 0 3px rgba(74,63,75,.045)}
.tag-chip{
  display:inline-flex;align-items:center;gap:1px;height:24px;padding:0 3px 0 8px;border-radius:7px;
  font-size:11px;white-space:nowrap;
  background:color-mix(in srgb,var(--tch) 16%,#fff);
  color:color-mix(in srgb,var(--tch) 58%,#4a3f4b);
  border:1px solid color-mix(in srgb,var(--tch) 26%,transparent);
}
.tag-chip button{width:18px;height:18px;display:grid;place-items:center;border-radius:5px;color:inherit;opacity:.55}
.tag-chip button:hover{background:rgba(74,63,75,.09);opacity:1}
.tag-chip svg{width:8px;height:8px}
.tag-editor input{flex:1;min-width:96px;height:24px;border:0;background:transparent;outline:none;font-size:12px;padding:0 2px;color:var(--ink)}
.tag-editor input::placeholder{color:var(--ink-4)}
.tag-add{
  flex:none;width:26px;height:26px;border-radius:7px;border:1px dashed var(--line);background:#fff;
  color:var(--ink-3);display:grid;place-items:center;font-size:15px;line-height:1;
}
.tag-add:hover{border-color:var(--rose-2);color:var(--ink)}
.tag-man{display:flex;flex-direction:column;max-height:48vh;overflow:auto}
.tag-man-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line-2)}
.tag-man-row:last-child{border-bottom:0}
.tag-man-n{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap}
.tag-man-row .btn.sm{height:28px;padding:0 9px;font-size:11px}
.tag-man-empty{padding:22px 10px;text-align:center;font-size:12px;color:var(--ink-3);border:1px dashed var(--line);border-radius:12px}

/* 快捷记录 */
.quick-tabs{display:inline-flex;gap:2px;padding:3px;background:var(--paper);border-radius:10px;border:1px solid var(--line-2);margin-bottom:4px}
.quick-tabs button{height:28px;padding:0 12px;border-radius:7px;font-size:11.5px;color:var(--ink-2)}
.quick-tabs button.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(74,63,75,.08);font-weight:500}
.qfield{display:none;margin-top:12px}
.qfield.show{display:block}
.due-chips{display:flex;gap:6px;flex-wrap:wrap}
.due-chips button{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:#fefbfc;font-size:11.5px;color:var(--ink-2)}
.due-chips button.is-on{border-color:var(--ink);color:var(--ink);background:var(--paper)}

/* 搜索面板 */
.palette{position:fixed;inset:0;z-index:95;display:none;padding:12vh 18px 18px;justify-content:center;align-items:flex-start}
.palette.is-open{display:flex}
.pal-bg{position:absolute;inset:0;background:rgba(74,63,75,.28);backdrop-filter:blur(10px)}
.pal-box{
  position:relative;width:100%;max-width:560px;background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(46,37,48,.5);animation:sheetUp .2s ease-out;
}
.pal-h{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line-2)}
.pal-h svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.pal-h input{flex:1;border:0;outline:none;background:none;font-size:14px;letter-spacing:-.01em;min-width:0}
.pal-h kbd{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.pal-list{max-height:56vh;overflow:auto;padding:8px}
.pal-foot{display:flex;align-items:center;gap:14px;padding:10px 16px;border-top:1px solid var(--line-2);font-family:var(--f-mono);font-size:9px;letter-spacing:.04em;color:var(--ink-3)}
.pal-foot kbd{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;margin-right:2px;border:1px solid var(--line);border-radius:4px;font-size:8px;color:var(--ink-3);vertical-align:middle}
.pal-group{padding:7px 9px 5px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 9px;border-radius:10px;text-align:left}
.pal-item:hover,.pal-item.is-cur{background:#f9f2f5}
.pal-ic{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--paper);color:var(--ink-2)}
.pal-ic svg{width:14px;height:14px}
.pal-tx{flex:1;min-width:0}
.pal-tx b{display:block;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-tx small{display:block;font-size:10px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-none{padding:26px 14px;text-align:center;font-size:12px;color:var(--ink-3);line-height:1.8}
.pal-enter{font-family:var(--f-mono);font-size:10px;color:var(--ink-4);flex:none}

/* 手机抽屉 */
.sheet{position:fixed;inset:0;z-index:88;display:none;align-items:flex-end;justify-content:center}
.sheet.is-open{display:flex}
.sheet-bg{position:absolute;inset:0;background:rgba(74,63,75,.28);backdrop-filter:blur(8px)}
.sheet-box{
  position:relative;width:100%;max-width:420px;margin:0 16px 20px;background:#fff;border-radius:24px;
  padding:10px 16px 16px;box-shadow:0 40px 80px -40px rgba(46,37,48,.5);animation:sheetUp .24s ease-out;
}
.sheet-grab{width:38px;height:4px;border-radius:99px;background:var(--paper-2);margin:4px auto 12px}
.sheet-t{font-size:11px;color:var(--ink-3);padding:0 8px 8px;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.sheet-row{display:flex;align-items:center;gap:11px;width:100%;padding:13px 8px;border-radius:12px;text-align:left;font-size:13px}
.sheet-row:hover{background:#f9f2f5}
.sheet-row svg{width:17px;height:17px;color:var(--ink-2)}
.sheet-row .sr-sub{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-family:var(--f-mono)}

/* toast：扁平长条，无图标 */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);z-index:120;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;max-width:min(560px,calc(100vw - 28px));
}
.toast.is-on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-in{
  display:flex;align-items:center;gap:9px;min-height:46px;padding:9px 9px 9px 15px;border-radius:12px;
  background:var(--dark);color:#fff;box-shadow:0 22px 38px -26px rgba(46,37,48,.65);
}
.toast-in .ti-tx{
  display:flex;align-items:baseline;gap:8px;min-width:0;
  font-size:12.5px;line-height:1.5;color:#f4ebef;
}
.toast-in .ti-tx b{
  flex:none;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.42);font-family:var(--f-mono);
}
.toast-in .ti-tx span{
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.toast-in .ti-act{
  margin-left:auto;flex:none;height:26px;padding:0 9px;border-radius:7px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px;
}
.toast-in .ti-act:hover{background:rgba(255,255,255,.2)}
.toast-in .ti-x{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:6px;color:rgba(255,255,255,.45)}
.toast-in .ti-x:hover{background:rgba(255,255,255,.1);color:#fff}
.toast-in .ti-x svg{width:12px;height:12px}
.spark-box{position:fixed;inset:0;pointer-events:none;z-index:115;overflow:hidden}
.spark-box i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:0;animation:sparkFall 1.15s ease-out forwards}
@keyframes sparkFall{0%{opacity:0;transform:translateY(-10px) scale(.6)}18%{opacity:.85}100%{opacity:0;transform:translateY(190px) rotate(180deg) scale(1)}}

/* ---------- 手机导航 ---------- */
.mobile-nav{display:none}
.mobile-brand{display:none}

/* ---------- 响应式 ---------- */
@media (max-width:1240px){
  .searchbox{min-width:220px}
  .page{padding:6px 26px 80px}
  .topbar{padding:14px 26px}
}
@media (max-width:1080px){
  .rail{display:none}
  .main{margin-left:0}
  .page{padding:4px 18px calc(96px + var(--safe-b))}
  .topbar{padding:12px 18px;gap:10px}
  .topbar .searchbox{display:none}
  .cloud-chip{height:28px;padding:0 9px;font-size:10px}
  .mobile-brand{display:flex}
  .mobile-nav{
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:60;
    height:64px;padding:0 6px;border-radius:22px;background:rgba(255,255,255,.92);
    border:1px solid var(--line);box-shadow:0 20px 44px -22px rgba(74,63,75,.45);
    backdrop-filter:blur(20px) saturate(1.4);
  }
  .mnav-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    height:100%;border-radius:14px;color:var(--ink-3);position:relative;
  }
  .mnav-item svg{width:20px;height:20px}
  .mnav-item span{font-size:8.5px;letter-spacing:.02em}
  .mnav-item.is-on{color:var(--ink)}
  .mnav-item.is-on::before{content:"";position:absolute;bottom:9px;width:3px;height:3px;border-radius:50%;background:var(--ink)}
  .mnav-fab{display:grid;place-items:center}
  .mnav-fab button{
    width:50px;height:50px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;
    box-shadow:0 14px 24px -14px rgba(74,63,75,.9);transition:transform .14s;
  }
  .mnav-fab button:active{transform:scale(.94)}
  .mnav-fab svg{width:22px;height:22px}
  .dash>*{grid-column:span 12!important}
  .hero{min-height:auto;padding:22px 20px;border-radius:22px}
  .hero h2{font-size:23px}
  .hero p{max-width:none;font-size:11.5px}
  .hero-side{flex-direction:row;align-items:center;gap:12px}
  .ring{width:94px;height:94px}
  .ring-n{font-size:25px}
  .sugar{min-height:auto;padding:18px 20px;border-radius:22px}
  .sugar-num{font-size:38px;margin:10px 0 4px}
  .sugar-foot{margin-top:12px}
  .week{flex-direction:column;align-items:stretch;gap:12px;padding:14px}
  .week-stats{border-left:0;padding-left:0;border-top:1px solid var(--line-2);padding-top:12px;justify-content:space-between}
  .wstat{flex:1;text-align:center}
  .col{grid-column:span 12!important}
  .stats-grid>*{grid-column:span 12!important}
  .sg-left,.sg-right{grid-column:span 12!important}
  .detail-grid>*{grid-column:span 12!important}
  .peek-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .proj-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .inbox-wrap{grid-template-columns:minmax(0,1fr)}
  .inbox-left{position:static}
  .inbox-left .capture textarea{min-height:88px}
  .page-foot{padding:14px 18px calc(90px + var(--safe-b));flex-direction:column;gap:6px;align-items:flex-start}
  .toast{
    left:12px;right:12px;bottom:calc(86px + var(--safe-b));max-width:none;
    transform:translateY(12px);
  }
  .toast.is-on{transform:none}
  .toast-in{width:100%;border-radius:12px;padding:9px 8px 9px 14px}
}
@media (max-width:860px){
  .topbar{padding:10px 16px}
  .page{padding:4px 16px calc(96px + var(--safe-b))}
  .ptitle{font-size:17px}
  .psub{display:none}
  .board{grid-template-columns:repeat(3,84%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;gap:10px}
  .bcol{scroll-snap-align:start;min-height:260px}
  .datagrid{grid-template-columns:minmax(0,1fr)}
  .tiles{gap:8px}
  .tile{padding:14px 13px}
  .tile-num{font-size:26px}
  .tile-label .micro{font-size:8.5px;letter-spacing:.12em}
  .tile-sub{font-size:9.5px}
  .peek-grid{grid-template-columns:minmax(0,1fr)}
  .peek-item:nth-child(n+3){display:none}
  .hero::after{display:none}
  .week-days{gap:2px}
  .wk-day{padding:7px 1px 6px;border-radius:11px}
  .wk-day .wn{font-size:13px}
  .wk-day .wd{font-size:8px;letter-spacing:.04em}
  .habit{padding:10px 6px;gap:11px}
  .habit-list{padding:4px 8px 6px}
  .h-ic{width:34px;height:34px;border-radius:10px}
  .h-name{font-size:12.5px}
  .h-meta{font-size:9.5px}
  .h-edit{opacity:1}
  .habit-prog{padding:2px 16px 10px}
  .stamp{display:none}
  .modal{padding:0;align-items:flex-end}
  .modal-box{max-width:100%;max-height:92vh;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + var(--safe-b));animation:sheetUp .24s ease-out}
  .palette{padding:8vh 12px 12px}
  .modal-actions .btn{height:42px}
  .sheet-box{max-width:100%;margin:0;border-radius:26px 26px 0 0;padding-bottom:calc(18px + var(--safe-b))}
}
@media (max-width:560px){
  .week-stats{gap:8px}
  .wstat b{font-size:16px}
  .hero{padding:20px 17px;gap:12px}
  .hero h2{font-size:21px;margin:9px 0 6px}
  .hero-eye span{font-size:9.5px}
  .hero-side .ring{width:82px;height:82px}
  .ring-n{font-size:22px}
  .ring-l{font-size:7.5px;letter-spacing:.1em}
  .hero-hint{display:none}
  .card-h{padding:16px 16px 0}
  .card-b{padding:12px 16px 16px}
  .sugar{padding:17px 17px 16px}
  .sugar-num{font-size:34px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tile{padding:12px 10px}
  .tile-num{font-size:22px}
  .tile-sub b{display:none}
  .rewards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-habits{padding:0}
  .topbar-l{gap:9px}
  .mark{width:32px;height:32px;border-radius:10px;font-size:13px}
  .btn.sm{height:30px}
  .proj-grid{grid-template-columns:minmax(0,1fr)}
  .idea-grid{grid-template-columns:minmax(0,1fr)}
  .chart14 .b:nth-child(even) i{opacity:.85}
  .chart14-x span{font-size:0}
  .chart14-x span.tick{font-size:7px}
  .sg-left,.sg-right{gap:12px}
  .hm{gap:4px}
  .hm-c{border-radius:4px}
  .field input,.field textarea,.field select{font-size:16px}
  .capture textarea{font-size:16px}
  .pal-h input{font-size:16px}
  .topbar .btn.primary{width:40px;padding:0;gap:0}
  .topbar .btn.primary span{display:none}
  .cloud-chip{height:28px;padding:0 9px;font-size:9.5px}
  .hm-c{height:38px;padding:5px 5px}
  .palette{padding:5vh 10px 10px}
  .pal-list{max-height:66vh}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<aside class="rail">
  <div class="rail-brand">
    <div class="mark">糖</div>
    <div><b>糖分打卡</b><small>SUGAR CHECK</small></div>
  </div>
  <div class="rail-sec micro">Menu</div>
  <nav class="nav" id="railNav"></nav>
  <div class="rail-foot">
    <div class="rail-sugar">
      <div class="rs-l">SUGAR BALANCE</div>
      <div class="rs-n" id="railSugar">0<small>糖分</small></div>
      <div class="rs-b"><i id="railSugarBar" style="width:0%"></i></div>
    </div>
    <div class="rail-tip">小愿陪你<br><b>慢慢攒糖</b> ♡</div>
    <div class="rail-swatches" aria-hidden="true"><i style="background:#f0d9e4"></i><i style="background:#c1a0ac"></i><i style="background:#806c79"></i><i style="background:#4a3f4b"></i></div>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-l">
      <div class="mobile-brand"><div class="mark">糖</div></div>
      <div style="min-width:0">
        <h1 class="ptitle" id="ptitle">今日</h1>
        <p class="psub" id="psub">每天一点点，糖分慢慢攒</p>
      </div>
    </div>
    <div class="topbar-r">
      <button class="searchbox" data-act="openSearch" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.6" cy="10.6" r="6.4"/><path d="m15.4 15.4 4.6 4.6"/></svg>
        <span class="sb-t">搜索任务、项目、灵感</span>
        <kbd>/</kbd>
      </button>
      <button type="button" class="cloud-chip" id="cloudChip" data-act="cloudChipClick" title="点击立即同步或前往设置"><i></i><span id="cloudText">本地</span></button>
      <button class="iconbtn" data-act="openSheet" aria-label="更多">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="btn primary" data-act="openQuick" aria-label="快速记录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>记录</span>
      </button>
    </div>
  </header>

  <main class="page" id="view"></main>

  <footer class="page-foot">
    <span id="footStatus">SUGAR CHECK · 数据保存在这台设备</span>
    <button data-act="go" data-r="data">备份与同步 →</button>
  </footer>
</div>

<nav class="mobile-nav" id="mobileNav">
  <button class="mnav-item" data-act="go" data-r="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2 12 4.4l8 6.8"/><path d="M6.3 10v9.6h11.4V10"/><path d="M12 19.6v-5.2"/></svg>
    <span>今日</span>
  </button>
  <button class="mnav-item" data-act="go" data-r="board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.6" y="4.6" width="4.6" height="14.8" rx="1.6"/><rect x="9.7" y="4.6" width="4.6" height="9.6" rx="1.6"/><rect x="15.8" y="4.6" width="4.6" height="12.6" rx="1.6"/></svg>
    <span>看板</span>
  </button>
  <div class="mnav-fab"><button data-act="openQuick" aria-label="快速记录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <button class="mnav-item" data-act="go" data-r="inbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.8h16v14.4H4z"/><path d="M4 14.4h4l1.3 2.4h5.4l1.3-2.4h4"/></svg>
    <span>收集</span>

    <span>项目</span>

</nav>

<div class="palette" id="palette">
  <div class="pal-bg" data-act="closeSearch"></div>
  <div class="pal-box">
    <div class="pal-h">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.6" cy="10.6" r="6.4"/><path d="m15.4 15.4 4.6 4.6"/></svg>
      <input id="palInput" placeholder="搜索任务、项目、习惯、灵感…" autocomplete="off" aria-label="搜索">
      <kbd>ESC</kbd>
    </div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>↵</kbd> 打开</span>
      <span><kbd>ESC</kbd> 关闭</span>
      <span style="margin-left:auto">糖分打卡 · 搜索</span>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-bg" data-act="closeSheet"></div>
  <div class="sheet-box">
    <div class="sheet-grab"></div>
    <div class="sheet-t">More</div>
    <button class="sheet-row" data-act="go" data-r="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19.6h16"/><path d="M7 19.6v-8"/><path d="M12 19.6V5.8"/><path d="M17 19.6v-5.4"/></svg>统计复盘<span class="sr-sub" id="sheetStatsSub"></span></button>
    <button class="sheet-row" data-act="go" data-r="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7.4" ry="2.8"/><path d="M4.6 6v6c0 1.6 3.3 2.8 7.4 2.8s7.4-1.2 7.4-2.8V6"/><path d="M4.6 12v6c0 1.6 3.3 2.8 7.4 2.8s7.4-1.2 7.4-2.8v-6"/></svg>数据与同步</button>
    <button class="sheet-row" data-act="addHabit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建习惯</button>
    <button class="sheet-row" data-act="addProject"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7.6h5.6l1.8 2.4h8.6v9.2H4z"/><path d="M4 7.6V5.4h4.8l1.4 2.2"/></svg>新建项目</button>
    <button class="sheet-row" data-act="exportJson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3.6v10.8"/><path d="M7.6 10.4 12 14.8l4.4-4.4"/><path d="M4.6 19.4h14.8"/></svg>导出备份</button>
    <button class="sheet-row" data-act="backToday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 1.8"/></svg>回到今天</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-bg" data-act="closeModal"></div>
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast">
  <div class="toast-in">
    <div class="ti-tx" id="toastTx"></div>
    <button class="ti-act" id="toastAct" style="display:none">撤销</button>
    <button class="ti-x" data-act="hideToast" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

/* ---------- 工具 ---------- */
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function praise(){return rnd(PRAISES);}
function pad(n){return String(n).padStart(2,'0');}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return isoOf(new Date());}
function parseISO(s){return new Date(s+'T00:00:00');}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function uid(p){return (p||'h_')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtDate(iso){var d=parseISO(iso);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function fmtMD(iso){var d=parseISO(iso);return (d.getMonth()+1)+'/'+d.getDate();}
function fmtTime(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate();}
function fmtClock(ts){if(!ts)return '';var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function weekdayCN(iso){return '周'+WEEK_CN[(parseISO(iso).getDay()+6)%7];}
function weekStart(d){var x=new Date(d.getTime());x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function diffDays(a,b){return Math.round((parseISO(a)-parseISO(b))/86400000);}
function isoDate(v){
  if(!v)return null;
  if(typeof v==='number'){var d=new Date(v);return isNaN(d.getTime())?null:isoOf(d);}
  var s=String(v).trim();
  var m=s.match(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  return null;
}
function fmtDue(d){
  if(!d)return '';
  var diff=diffDays(d,todayISO());
  if(diff===0)return '今天';
  if(diff===1)return '明天';
  if(diff===-1)return '昨天';
  if(diff<0)return fmtMD(d);
  return fmtMD(d);
}
function greeting(){
  var h=new Date().getHours();
  if(h<5)return '还没睡呀小言';
  if(h<11)return '早上好呀';
  if(h<14)return '午间好呀';
  if(h<18)return '下午好，小画师';
  return '晚上好呀';
}

function normHabit(h){
  return {id:String(h.id||uid()),name:String(h.name||'').slice(0,24),icon:ICON_PATHS[h.icon]?h.icon:'star',
    color:/^#[0-9a-f]{6}$/i.test(h.color||'')?h.color:'#c1a0ac',created:h.created||todayISO(),updatedAt:Number(h.updatedAt)||0};
}
function normTags(v){
  if(Array.isArray(v))return v.filter(Boolean).map(x=>String(x).replace(/^#/,'').slice(0,10)).slice(0,4);
  if(typeof v==='string'&&v.trim())return v.split(/[,，#\s]+/).filter(Boolean).map(x=>x.slice(0,10)).slice(0,4);
  return [];
}
function normTask(t,pid){
  var done=!!t.done;
  var st=ST_ORDER.indexOf(t.status)>-1?t.status:(done?'done':'todo');
  if(st==='done')done=true;
  return {
    id:String(t.id||uid('t_')),
    name:String(t.name||'').slice(0,60),
    done:done,
    status:st,
    prevStatus:t.prevStatus||null,
    due:isoDate(t.due),
    priority:PRI_LABEL[t.priority]?t.priority:'mid',
    tags:normTags(t.tags),
    estimate:Math.max(0,parseInt(t.estimate,10)||0),
    projectId:pid||t.projectId||null,
    note:String(t.note||'').slice(0,200),
    start:/^\d{1,2}:\d{2}$/.test(t.start||'')?t.start:'',
    created:t.created||todayISO(),
    doneAt:t.doneAt||null,
    updatedAt:Number(t.updatedAt)||0
  };
}
function normMilestone(m){
  return {id:String(m.id||uid('ms_')),name:String(m.name||'').slice(0,40),date:isoDate(m.date),done:!!m.done,updatedAt:Number(m.updatedAt)||0};
}
function normProject(p){

    icon:ICON_PATHS[p.icon]?p.icon:'brush',

function normalizeState(raw){
  var s=blankState();
  if(!raw||typeof raw!=='object')return s;
  if(Array.isArray(raw.habits))s.habits=raw.habits.filter(h=>h&&h.name).map(normHabit);
  if(raw.records&&typeof raw.records==='object')s.records=raw.records;
  if(Array.isArray(raw.projects))s.projects=raw.projects.filter(p=>p&&p.name).map(normProject);
  if(raw.points&&typeof raw.points==='object')s.points={earned:Math.max(0,parseInt(raw.points.earned,10)||0),spent:Math.max(0,parseInt(raw.points.spent,10)||0)};
  if(Array.isArray(raw.rewards))s.rewards=raw.rewards.filter(r=>r&&r.name).map(normReward);
  if(Array.isArray(raw.redemptions))s.redemptions=raw.redemptions.slice(0,200);
  if(Array.isArray(raw.ideas))s.ideas=raw.ideas.filter(i=>i&&i.text).map(normIdea);
  if(raw.cloud&&typeof raw.cloud==='object')s.cloud=Object.assign(s.cloud,raw.cloud);
  if(typeof s.cloud.auto!=='boolean')s.cloud.auto=true;
  if(raw.reviews&&typeof raw.reviews==='object')s.reviews=raw.reviews;
  if(Array.isArray(raw.tagPool))s.tagPool=raw.tagPool.filter(Boolean).map(x=>String(x).replace(/^#/,'').slice(0,10)).slice(0,40);
  if(raw._tombstones&&typeof raw._tombstones==='object')s._tombstones=raw._tombstones;
  if(raw._recMeta&&typeof raw._recMeta==='object')s._recMeta=raw._recMeta;
  if(raw._revMeta&&typeof raw._revMeta==='object')s._revMeta=raw._revMeta;
  s.lastSyncAt=raw.lastSyncAt||null;s.demo=!!raw.demo;
  s.schemaVersion=Math.max(2,parseInt(raw.schemaVersion,10)||2);
  return s;
}

/* ---------- 查询 ---------- */
function habitById(id){return state.habits.find(h=>h.id===id)||null;}
function projectById(id){return state.projects.find(p=>p.id===id)||null;}
function rewardById(id){return state.rewards.find(r=>r.id===id)||null;}
function ideaById(id){return state.ideas.find(i=>i.id===id)||null;}
function allTasks(){var out=[];state.projects.forEach(p=>p.tasks.forEach(t=>{t.projectId=p.id;out.push(t);}));return out;}
function allTags(){
  var out=(state.tagPool||[]).slice();
  allTasks().forEach(t=>(t.tags||[]).forEach(x=>{if(out.indexOf(x)<0)out.push(x);}));
  return out;
}
function tagColor(tag){var n=0;String(tag).split('').forEach(c=>{n+=c.charCodeAt(0);});return COLOR_SET[n%COLOR_SET.length];}
function taskById(id){
  for(var i=0;i<state.projects.length;i++){var t=state.projects[i].tasks.find(x=>x.id===id);if(t)return t;}
  return null;
}
function taskProject(t){return t&&t.projectId?projectById(t.projectId):null;}
function isDone(d,id){var a=state.records[d];return !!(a&&a.indexOf(id)>-1);}
function doneOn(d){return state.records[d]||[];}
function countForHabit(id,mKey){var n=0;Object.keys(state.records).forEach(d=>{if(d.slice(0,7)===mKey&&state.records[d].indexOf(id)>-1)n++;});return n;}
function monthDoneCount(mKey){var n=0;Object.keys(state.records).forEach(d=>{if(d.slice(0,7)===mKey)n+=state.records[d].length;});return n;}
function streakOf(id){var n=0,c=new Date();if(!isDone(isoOf(c),id))c=addDays(c,-1);while(isDone(isoOf(c),id)){n++;c=addDays(c,-1);}return n;}
function bestStreak(){var b=0;state.habits.forEach(h=>{b=Math.max(b,streakOf(h.id));});return b;}
function elapsedDays(mKey){
  var cur=monthKey(new Date());
  if(mKey===cur)return new Date().getDate();
  if(mKey<cur)return new Date(parseInt(mKey.slice(0,4),10),parseInt(mKey.slice(5,7),10),0).getDate();
  return 0;
}
function monthRate(mKey){var t=state.habits.length*elapsedDays(mKey);return t?Math.min(1,monthDoneCount(mKey)/t):0;}
function balance(){return Math.max(0,state.points.earned-state.points.spent);}
function addPoints(n){state.points.earned=Math.max(0,state.points.earned+n);}
function projStats(p){var d=p.tasks.filter(t=>t.status==='done'||t.done).length;return {done:d,total:p.tasks.length,pct:p.tasks.length?Math.round(d/p.tasks.length*100):0};}
function allTaskStats(){var d=0,t=0;state.projects.forEach(p=>{p.tasks.forEach(x=>{t++;if(x.done)d++;});});return {done:d,total:t};}
function tasksByDue(d){return allTasks().filter(t=>t.due===d);}
function overdueTasks(){var T=todayISO();return allTasks().filter(t=>t.status!=='done'&&t.due&&t.due<T);}
function nextReward(){
  var b=balance(),list=state.rewards.slice().sort((x,y)=>x.cost-y.cost);
  for(var i=0;i<list.length;i++){if(list[i].cost>b)return list[i];}
  return list.length?list[list.length-1]:null;
}
function ensureProject(){
  if(state.projects.length)return state.projects[0];
  var p={id:uid('p_'),name:'收件箱',icon:'bulb',color:'#a98d9b',note:'还没有分类的任务先放这里。',created:todayISO(),updatedAt:Date.now(),milestones:[],tasks:[]};
  state.projects.push(p);return p;
}
